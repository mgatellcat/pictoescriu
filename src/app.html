<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PictoEscriu</title>
<style>

/* Layout: fixed two-row toolbar · grey workspace with real A4 sheets · contextual panel on the right (bottom sheet on tablets) */
:root{
  --ws:#E9EBF0; --bar:#FFFFFF; --ink:#1B2232; --muted:#5A6476; --line:#D3D9E2; --soft:#F1F4F8;
  --accent:#24386A; --accent-weak:#E6EAF3; --accent-line:#AFBAD3; --orange:#EB6B24; --orange-dark:#D25A16; --danger:#B3261E; --danger-weak:#FBEAE9;
  --head-fill:#F3F7FF;
  --c-persones:#F5C400; --c-verbs:#2E9E44; --c-descriptius:#1F6FD1; --c-substantius:#F07C00; --c-social:#E5559A; --c-misc:#FFFFFF;
  --font:"Roboto","Helvetica Neue",Arial,sans-serif;
  --bar-h:96px; --panel-w:330px; --pic:26mm; --zoom:1;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--ws);font-size:14px;overflow:hidden}
button,input,select{font-family:inherit}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* ---------- Toolbar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--bar);border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(27,34,50,.06)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:6px 12px}
.row+.row{border-top:1px solid var(--soft)}
.grp{display:flex;align-items:center;gap:3px;padding-right:8px;margin-right:2px;border-right:1px solid var(--line)}
.grp:last-child{border-right:0}
.spacer{flex:1}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-right:8px;letter-spacing:.01em}
.brand svg{width:26px;height:26px}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--soft)}
.btn:focus-visible,.sel-in:focus-visible,.fld:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent-line);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--orange);color:#fff;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.btn.primary:hover:not(:disabled){background:var(--orange-dark)}
.btn.outline{border-color:var(--line)}
.btn.next{border-color:var(--accent);color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.btn.next:hover:not(:disabled){background:var(--accent-weak)}
.btn.icon-only{padding:0 7px}
.badge{font-size:11px;font-weight:700;background:var(--accent-weak);color:var(--accent);padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.btn:disabled .badge{background:var(--soft);color:var(--muted)}
.lab{font-size:12px;color:var(--muted);margin:0 2px 0 4px}
.sel-in{height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:0 6px;font-size:13px}
input[type=color].sel-in{width:38px;padding:2px}
#sFont{width:150px}
input[type=range]{width:96px;accent-color:var(--accent)}
.val{font-size:12px;color:var(--ink);min-width:42px;font-variant-numeric:tabular-nums}
.scope{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--soft);border-radius:999px;padding:4px 10px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scope b{color:var(--ink);font-weight:700}
.scope.block{background:#FFF4D6;color:#6B5200}
.busy{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.spin{width:12px;height:12px;border:2px solid var(--accent-line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Primera fila: blau marí d'AREMI amb línia taronja; segona fila: cinta clara */
.topbar .row:first-child{background:var(--accent);border-bottom:3px solid var(--orange)}
.topbar .row+.row{background:#F6F7FA;border-top:0}
.topbar .row:first-child .brand,.topbar .row:first-child > .grp > svg.ic{color:#fff}
.topbar .row:first-child .grp{border-right-color:rgba(255,255,255,.22)}
.topbar .row:first-child .btn:not(.primary):not(.play){color:#fff}
.topbar .row:first-child .btn:not(.primary):not(.play):hover:not(:disabled){background:rgba(255,255,255,.14)}
.topbar .row:first-child .btn:focus-visible{outline-color:#fff}
.topbar .row:first-child .busy{color:#DCE3F2}
.topbar .row:first-child .sel-in{border-color:transparent}
.brand svg{width:30px;height:30px}

/* ---------- Pantalla d'inici ---------- */
.splash{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#24386A 0%,#2F4682 60%,#24386A 100%);cursor:pointer;transition:opacity .45s}
.splash.out{opacity:0;pointer-events:none}
.splash .card{background:#fff;border-radius:28px;padding:40px 60px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);border-bottom:8px solid var(--orange);max-width:calc(100vw - 32px)}
.splash svg{width:140px;height:140px}
.splash h1{margin:12px 0 4px;font-size:44px;color:var(--accent);letter-spacing:.01em}
.splash h1 span{color:var(--orange)}
.splash p{margin:0;color:var(--muted);font-size:18px}
.splash .v{margin-top:16px;font-size:13px;color:#8A93A3}
@media (prefers-reduced-motion:reduce){.splash{transition:none}}

/* ---------- Workspace & sheets ---------- */
.zoombar{position:fixed;left:16px;bottom:16px;z-index:24;display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:0 4px 14px rgba(27,34,50,.12)}
.zoombar .btn{height:30px;font-size:12px}
.workspace{position:fixed;top:var(--bar-h);left:0;right:0;bottom:0;overflow:auto;background:var(--ws)}
body.panel-open .workspace{right:var(--panel-w)}
.stack{zoom:var(--zoom);display:flex;flex-direction:column;align-items:center;gap:10mm;padding:10mm 8mm 16mm;width:max-content;min-width:100%;margin:0 auto}
.stack:focus{outline:none}
.page{width:210mm;height:297mm;background:#fff;position:relative;flex:none;box-shadow:0 1px 2px rgba(20,30,50,.12),0 6px 20px rgba(20,30,50,.10)}
.page-inner{position:absolute;inset:15mm;display:flex;flex-direction:column}
.flow{flex:1;min-height:0;position:relative;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:flex-end;gap:5mm 0;overflow:hidden;cursor:text}
.attrib{flex:none;min-height:6mm;white-space:pre-line;display:flex;align-items:flex-end;justify-content:center;text-align:center;font-size:6.5pt;line-height:1.2;color:#707070}
.pnum{position:absolute;right:15mm;bottom:6mm;font-size:7pt;color:#9aa1ad}
.hint{position:absolute;left:0;right:0;top:40mm;text-align:center;color:#9AA3B2;font-size:15pt;pointer-events:none}

/* Header (worksheet style) */
.sheet-head{flex:none;position:relative;width:180mm;margin-bottom:6mm}
.hd-art{position:absolute;left:0;top:0;width:100%;height:100%;display:block;max-width:none;pointer-events:none;user-select:none}
.hf{position:absolute;height:8mm;display:flex;align-items:flex-end;gap:2mm;min-width:0}
.hl{font-size:12pt;font-weight:700;color:var(--accent);letter-spacing:.04em;line-height:1.2;white-space:nowrap}
.hi{flex:1;min-width:20mm;border:0;border-bottom:0.3mm solid #555;background:transparent;font-size:14pt;line-height:1.2;padding:0 1mm;color:#000;border-radius:0}
.hi:focus{outline:none;border-bottom-color:var(--accent);background:rgba(36,83,184,.06)}
.today{flex:none;font-size:8pt;height:5.5mm;padding:0 2mm;margin-bottom:0.6mm;border:1px solid var(--accent-line);border-radius:5mm;background:#fff;color:var(--accent);cursor:pointer}

/* Blocks */
.blk{box-sizing:content-box;padding:0 max(1.2mm, calc(var(--fs, 20pt) * 0.25));display:flex;flex-direction:column;align-items:center;min-width:var(--pic);max-width:calc(var(--pic) * 2.3);position:relative;border-radius:2mm}
.blk.empty{min-width:5mm}
.blk.empty .pic{width:0;padding:0;border:0}
.blk.br{flex-basis:100%;min-width:0;max-width:none;height:0;padding:0}
.blk.br.blank{height:7mm}
/* Paraula seleccionada: només un fons blau suau, sense cap requadre de línies. Mentre s'escriu o s'esborra, res: només el cursor. */
.blk.sel{background:rgba(36,83,184,.10);box-shadow:0 0 0 1.2mm rgba(36,83,184,.10)}
.blk.sel.editing{background:none;box-shadow:none}
.lbl{flex:none;text-align:center;line-height:1.2;font-synthesis:none;overflow-wrap:break-word;max-width:100%;color:#000;margin-bottom:1.4mm;white-space:pre-wrap;cursor:default}
.lbl:empty::before{content:"\00a0"}
.blk.composing .lbl,.blk.editing .lbl{border-bottom:0.5mm solid var(--accent)}
.notext .blk:not(.editing):not(.composing) .lbl.hasp{display:none}
.ed{border:0;outline:none;background:transparent;font:inherit;color:inherit;text-align:center;padding:0;margin:0;min-width:4mm;letter-spacing:inherit}
.case-upper .blk.composing .ed{text-transform:uppercase}
.case-lower .blk.composing .ed{text-transform:lowercase}
.pic{flex:none;width:var(--pic);height:var(--pic);border:1.2mm solid transparent;padding:1mm;border-radius:1.8mm;background:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.pic img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.pic.spacer{visibility:hidden}
.blk.textonly{min-width:0}
/* Opció «Picto a sobre»: el pictograma damunt de la paraula (la frase queda a la línia de sota) */
.pic-above .blk .pic{order:-1}
.pic-above .blk .lbl{margin-bottom:0;margin-top:1.4mm}
.pic{flex-direction:column}
.pic .cap{display:none;flex:none;max-width:100%;color:#000;line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;font-synthesis:none}
.pic.cap-top .cap,.pic.cap-bottom .cap{display:block}
.pic.cap-bottom .cap{order:2}
.pic.cap-top img,.pic.cap-bottom img{flex:1 1 0;min-height:0;height:auto}
.blk.textonly .pic{width:0;padding:0;border:0}
.blk.nores .pic .ph{display:flex;visibility:visible;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:7mm;height:7mm;border:0.4mm dashed #C3CAD5;border-radius:50%;color:#8A93A3;font:700 9pt "Roboto",Arial,sans-serif;align-items:center;justify-content:center;pointer-events:none}
.pic .ph{display:none;color:#8A93A3;font-size:9pt;text-align:center;line-height:1.2;align-items:center;justify-content:center;flex-direction:column;gap:1mm}
.pic.st-none,.pic.st-error,.pic.st-loading,.pic.st-idle{border:0.4mm dashed #C3CAD5;background:#FAFBFC}
.pic.st-error{border-color:#E3A7A3}
.pic.st-none .ph,.pic.st-error .ph{display:flex}
.pic.st-error .ph{color:var(--danger)}
.pic.st-loading::after{content:"";position:absolute;inset:3mm;border-radius:1mm;background:linear-gradient(90deg,#EEF1F5 25%,#F8F9FB 50%,#EEF1F5 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.fitz-frame .pic.st-ok.cat-persones{border-color:var(--c-persones)}
.fitz-frame .pic.st-ok.cat-verbs{border-color:var(--c-verbs)}
.fitz-frame .pic.st-ok.cat-descriptius{border-color:var(--c-descriptius)}
.fitz-frame .pic.st-ok.cat-substantius{border-color:var(--c-substantius)}
.fitz-frame .pic.st-ok.cat-social{border-color:var(--c-social)}
.fitz-bg .pic.st-ok.cat-persones{background:var(--c-persones);border-color:var(--c-persones)}
.fitz-bg .pic.st-ok.cat-verbs{background:var(--c-verbs);border-color:var(--c-verbs)}
.fitz-bg .pic.st-ok.cat-descriptius{background:var(--c-descriptius);border-color:var(--c-descriptius)}
.fitz-bg .pic.st-ok.cat-substantius{background:var(--c-substantius);border-color:var(--c-substantius)}
.fitz-bg .pic.st-ok.cat-social{background:var(--c-social);border-color:var(--c-social)}
@media (prefers-reduced-motion:reduce){.pic.st-loading::after,.spin{animation:none}}

/* ---------- Contextual panel ---------- */
.panel{position:fixed;top:var(--bar-h);right:0;bottom:0;width:var(--panel-w);background:#fff;border-left:1px solid var(--line);overflow-y:auto;z-index:25;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.ph-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph-top h2{font-size:15px;margin:0;font-weight:700}
.sec{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--soft)}
.sec h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.fld{height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:15px;width:100%;min-width:0}
.fld-row{display:flex;gap:6px}
.fld-row .fld{flex:1}
.prev-box{display:flex;gap:12px;align-items:center}
.prev{width:96px;height:96px;flex:none;border:2px solid var(--line);border-radius:10px;padding:6px;display:flex;align-items:center;justify-content:center;background:#fff}
.prev img{max-width:100%;max-height:100%}
.msg{font-size:12.5px;color:var(--muted);line-height:1.4}
.msg.err{color:var(--danger)}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.alts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.alts button{aspect-ratio:1;border:2px solid var(--line);border-radius:8px;background:#fff;padding:4px;cursor:pointer}
.alts button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
.alts img{width:100%;height:100%;object-fit:contain}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cat{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;text-align:left}
.cat[aria-checked="true"]{border-color:var(--accent);background:var(--accent-weak);font-weight:700}
.sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.2);flex:none}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);align-self:flex-start}
.tag.man{background:#FFF4D6;color:#6B5200}
.danger{color:var(--danger);border-color:#E9B7B3}
.danger:hover:not(:disabled){background:var(--danger-weak)!important}
.stack-btns{display:flex;flex-wrap:wrap;gap:6px}
.alts.web button{position:relative}
.alts.web button.busy{opacity:.45;cursor:progress}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-right:1px solid var(--line);background:#fff;padding:8px 4px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-weak);color:var(--accent);font-weight:700}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hl-search{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}

/* ---------- Veu: botó Llegir, mode alumne i ressaltat ---------- */
.pi{display:inline-flex}
.btn.play{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.btn.play:hover:not(:disabled){background:var(--orange-dark)}
.btn.play .ic,.playfab .ic{fill:currentColor}
.btn.play[aria-pressed="true"]{background:#fff;border-color:var(--orange);color:var(--accent)}
.btn.play[aria-pressed="true"]:hover{background:#FFF1E8}
body.student #bPlay{height:40px;padding:0 14px;font-size:14px}
#bStudent[aria-pressed="true"]{background:#FFF4D6;border-color:#E9C46A;color:#6B5200}
.playfab{position:fixed;right:24px;bottom:24px;z-index:24;width:84px;height:84px;border-radius:50%;border:0;background:var(--orange);color:#fff;box-shadow:0 8px 24px rgba(20,40,90,.35);display:flex;align-items:center;justify-content:center;cursor:pointer}
.playfab .ic{width:40px;height:40px}
.playfab[aria-pressed="true"]{background:var(--danger)}
.playfab:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
body.panel-open .playfab{right:calc(var(--panel-w) + 24px)}
/* El ressaltat no canvia cap mida: només el fons. No surt ni al PDF ni a la impressió. */
.blk.speaking{background:var(--speak,#FFE36E);box-shadow:0 0 0 1.2mm var(--speak,#FFE36E)}
.lbl .spell-on{background:#FF9F43;border-radius:1mm;box-shadow:0 0 0 0.5mm #FF9F43}
.dialog.voice{max-width:620px;max-height:calc(100vh - 32px);overflow-y:auto;gap:10px}
.vsec{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--soft)}
.vsec h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dialog label.chk{color:var(--ink);font-size:13.5px;align-items:flex-start;line-height:1.35}
.dialog label.chk input{margin:2px 0 0;flex:none;width:16px;height:16px;accent-color:var(--accent)}
.dialog label.chk.big{font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.dialog label.chk.big:has(input:checked){background:#FFF4D6;border-color:#E9C46A}
.vopts{display:flex;flex-direction:column;gap:8px}
.vopts.off{opacity:.55}
.vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dialog .vrow label{min-width:72px;color:var(--ink);font-weight:500}
.vrow select{flex:1;min-width:180px;max-width:100%}
.vrow input[type=range]{flex:1;min-width:140px;width:auto}
.swatches{display:flex;gap:8px}
.swatches button{width:34px;height:28px;border-radius:7px;border:2px solid var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent-weak)}
.dialog .msg{margin:0}
.seg.sub{margin-left:24px}
.dialog.snd{max-width:660px}
.sndlist{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto;padding-right:4px}
.sndrow{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line);border-radius:8px}
.sndrow.has{background:#EAF6EC;border-color:#B9DFC0}
.sndl{flex:1;min-width:0;font-size:14px}
.memnote{background:#FFF4D6;color:#6B5200;border-radius:8px;padding:6px 10px}
.memgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;max-height:50vh;overflow:auto}
.memcard{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.memcard img{width:72px;height:72px;object-fit:contain}
.btn.rec{background:var(--danger);color:#fff;border-color:var(--danger)}
/* Pantalla bloquejada per a l'alumne: sense barres ni panell; es desbloqueja prement el cadenat 7 vegades seguides */
body.locked .topbar,body.locked .panel,body.locked .zoombar{display:none!important}
body.locked .workspace{top:0;right:0;bottom:0}
body.locked .playfab{right:24px;bottom:24px}
.lockbar{position:fixed;top:10px;right:12px;z-index:40;display:flex;align-items:center;gap:6px}
.lockbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.85);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.lockbtn .ic{width:18px;height:18px}
.lockdots{font-size:13px;color:var(--muted);letter-spacing:2px;min-width:0}
body.is-full #bFull{display:none}
.pvrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}
.pvrow.ok{background:#EAF6EC;border-color:#B9DFC0;color:#1E5B2B}
.pvrow.ok span{flex:1;font-size:13px}
.pvrow.dl{flex-direction:column;align-items:flex-start}
.btn.pvdl{background:var(--accent);color:#fff;height:auto;min-height:38px;padding:6px 12px;white-space:normal;text-align:left}
.btn.pvdl:hover:not(:disabled){background:#1A2A52}
.pvbar{flex:1;min-width:160px;height:12px;border-radius:6px;background:#fff;border:1px solid var(--line);overflow:hidden}
.pvbar span{display:block;height:100%;background:var(--accent);transition:width .2s}

/* ---------- Dialogs & toasts ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,26,40,.38);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.dialog{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px}
.dialog h2{margin:0;font-size:18px}
.dialog p{margin:0;line-height:1.5;color:#2c3446}
.dialog.gallery{max-width:780px}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:62vh;overflow:auto;padding:2px}
.hcard{display:flex;flex-direction:column;gap:6px;border:2px solid var(--line);border-radius:12px;background:#fff;padding:8px;cursor:pointer;text-align:left;font-size:13px;font-weight:500;color:var(--ink)}
.hcard:hover{border-color:var(--accent-line)}
.hcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak);font-weight:700}
.hcard img{width:100%;height:auto;display:block}
.hcard .noneart{display:flex;align-items:center;justify-content:center;aspect-ratio:180/30;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:12px}
.bwchk{align-self:flex-start}
@media (max-width:640px){.hgrid{grid-template-columns:1fr}}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:6px}
.dialog label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:70;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:#1B2232;color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:min(560px,92vw)}
.toast.error{background:#7A1C17}
.toast button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:700;font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Mòbils i tauletes: cap botó pot quedar fora de la pantalla; als mòbils, la segona fila (format) s'obre amb el botó «Format» */
#gTools{display:none}
@media (max-width:900px){ .grp{flex-wrap:wrap;row-gap:4px} }
@media (max-width:640px){
  #gTools{display:flex}
  body:not(.tools-open) .topbar .row+.row{display:none}
  .row{padding:4px 8px}
  .grp{padding-right:4px;margin-right:0}
  #bTools .t{display:inline}
}
/* La primera fila ha de cabre en una línia: a les pantalles més estretes, alguns botons només mostren la icona */
@media (max-width:1599px){ #bUndo .t,#bRedo .t,#bCredits .t,#bVoice .t,#bLock .t{display:none} }
@media (max-width:1365px){ .brand span,#bNew .t,#bOpen .t,#bSave .t{display:none} }
@media (max-width:1180px){
  .btn .t{display:none}
  .btn.next .t,.btn.primary .t,#bApplyAll .t,#bPlay .t{display:inline}
  .brand span{display:none}
}
@media (max-width:900px){
  .panel{top:auto;left:0;width:auto;height:46vh;border-left:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.08)}
  body.panel-open .workspace{right:0;bottom:46vh}
  body.panel-open .zoombar{display:none}
  body.panel-open .playfab{right:16px;bottom:calc(46vh + 16px)}
  .btn.primary .t{display:none}
  .topbar .grp > svg.ic{display:none}
}

/* ---------- Print ---------- */
@page{size:A4 portrait;margin:0}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  .topbar,.panel,.toasts,.overlay,.no-print,.hint,.zoombar{display:none!important}
  .workspace{position:static;overflow:visible;background:#fff}
  .stack{zoom:1!important;padding:0;gap:0;display:block;width:auto;min-width:0}
  .page{box-shadow:none;margin:0;height:296.6mm;overflow:hidden;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .page-inner{bottom:14.6mm}
  .blk.sel{outline:none;background:none;box-shadow:none}
  .blk.speaking,.lbl .spell-on{background:none!important;box-shadow:none!important}
  .playfab,.lockbar,.splash{display:none!important}
  .blk.composing .lbl,.blk.editing .lbl{border-bottom:0}
  .pic.st-none,.pic.st-error,.pic.st-loading,.pic.st-idle{visibility:hidden}
  .blk.nores .pic .ph{display:none}
  .hi{border-bottom-color:#555;background:transparent}
  .today{visibility:hidden}
  .sheet-head,.pic{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

const qcache = new Map();
let active = 0; const queue = [];
function limited(fn){ return new Promise((res, rej) => { queue.push({fn, res, rej}); pump(); }); }
function pump(){ while(active < 4 && queue.length){ const {fn, res, rej} = queue.shift(); active++;
  fn().then(res, rej).finally(() => { active--; pump(); }); } }
async function getJSON(url){
  let r;
  try{ r = await fetch(url, {headers:{Accept:'application/json'}}); }
  catch(e){ const err = new Error('net'); err.net = true; throw err; }
  if(r.status === 404) return [];
  if(!r.ok){ const err = new Error('http ' + r.status); err.net = true; throw err; }
  const j = await r.json(); return Array.isArray(j) ? j : [];
}
function toPicto(p){ return {id:p._id, kw:(p.keywords||[]).slice(0,8).map(k => [k.keyword, k.type])}; }
function cachedGet(key, url){
  if(qcache.has(key)) return qcache.get(key);
  const p = limited(() => getJSON(url));
  qcache.set(key, p); p.catch(() => qcache.delete(key));
  return p;
}
// bestsearch: coincidències exactes (ja resol plurals). search: cerca àmplia i sorollosa ("la" → 476 resultats), cal filtrar-la.
const apiBest = (lang, q) => cachedGet('b|' + lang + '|' + q, `${API}/${lang}/bestsearch/${encodeURIComponent(q)}`);
const apiSearch = (lang, q) => cachedGet('s|' + lang + '|' + q, `${API}/${lang}/search/${encodeURIComponent(q)}`);
const kwOf = (p, v, prefix) => (p.keywords || []).find(k => { const n = norm(k.keyword); return n === v || (prefix && v.length >= 3 && n.length > v.length && n.startsWith(v) && n.length - v.length <= 2); });
// Primer els pictogrames on la paraula és la paraula clau principal (p. ex. «la» article abans que «ella»)
const mainKw = (p, v) => norm(((p.keywords || [])[0] || {}).keyword) === v ? 0 : 1;
const firstKw = (list, v) => list.map((p, i) => [p, i]).sort((a, b) => (mainKw(a[0], v) - mainKw(b[0], v)) || a[1] - b[1]).map(x => x[0]);
function mergePictos(...lists){
  const seen = new Set(), out = [];
  for(const l of lists) for(const x of l){ if(x && x._id != null && !seen.has(x._id)){ seen.add(x._id); out.push(toPicto(x)); } }
  return out.slice(0, 40);
}
// Formes flexionades: variants lingüístiques prudents. El text visible no canvia mai.
function variants(q, lang){
  const out = [q]; const add = v => { if(v && v.length > 1 && !out.includes(v)) out.push(v); };
  let w = q;
  if(lang === 'ca'){
    const m = w.match(/^(?:l|d|s|m|t|n)'(.+)$/); if(m){ w = m[1]; add(w); }
    const h = w.split(/[-']/)[0]; if(h !== w){ w = h; add(w); }
    const R = [[/es$/, 'a'], [/ns$/, ''], [/s$/, ''], [/(ades|ats|ada|at)$/, 'ar'], [/(ava|aves|àvem|àveu|aven)$/, 'ar'], [/(ant)$/, 'ar'],
      [/(ides|its|ida|it|int)$/, 'ir'], [/a$/, 'ar'], [/(o|em|eu|en)$/, 'ar'],
      // femení i plural → masculí singular (ARASAAC té els adjectius en masculí): verda → verd, groga → groc, nova → nou, roja → roig
      [/gues$/, 'c', 2], [/ga$/, 'c', 2], [/ques$/, 'c'], [/ves$/, 'u', 2], [/va$/, 'u', 2], [/ges$/, 'ig', 2], [/ja$/, 'ig', 2], [/sses$/, 's'], [/ssa$/, 's'], [/es$/, ''], [/a$/, '']];
    for(const [re, rep, min] of R){ if(re.test(w) && w.replace(re, '').length >= (min || 3)) add(w.replace(re, rep)); }
  } else {
    const R = [[/es$/, ''], [/s$/, ''], [/(ados|adas|ado|ada)$/, 'ar'], [/(idos|idas|ido|ida)$/, 'er'], [/(idos|idas|ido|ida)$/, 'ir'], [/(ando)$/, 'ar'], [/(iendo)$/, 'er'],
      [/(aba|abas|aban)$/, 'ar'], [/(an|amos|o)$/, 'ar'], [/(en|emos|e)$/, 'er'], [/a$/, 'ar'],
      // femenino → masculino: roja → rojo, blancas → blanco, trabajadora → trabajador
      [/as$/, 'o'], [/a$/, 'o'], [/as$/, ''], [/a$/, '']];
    for(const [re, rep] of R){ if(re.test(w) && w.replace(re, '').length >= 3) add(w.replace(re, rep)); }
  }
  return out.slice(0, 12);
}
async function findPictos(q, lang){
  const nq = norm(q);
  // 1. Coincidència exacta d'ARASAAC
  const best = await apiBest(lang, q);
  const all = await apiSearch(lang, q).catch(e => { if(best.length) return []; throw e; });
  if(best.length) return {list:mergePictos(firstKw(best, nq), firstKw(all.filter(p => kwOf(p, nq, false)), nq)), used:q};
  // 2. Cerca àmplia filtrada: només paraules clau iguals o gairebé iguals («menja» → «menjar», «beu» → «beure»)
  const exact = all.filter(p => kwOf(p, nq, false));
  if(exact.length) return {list:mergePictos(firstKw(exact, nq)), used:q};
  const near = all.filter(p => kwOf(p, nq, true));
  if(near.length){ const kw = kwOf(near[0], nq, true).keyword; return {list:mergePictos(near.filter(p => kwOf(p, norm(kw), false))), used:kw}; }
  // 3. Variants lingüístiques (elisions, plurals, participis…), només amb coincidència exacta
  for(const v of variants(q, lang).slice(1)){
    const b = await apiBest(lang, v);
    if(b.length){ const nv = norm(v); const more = await apiSearch(lang, v).catch(() => []);
      return {list:mergePictos(firstKw(b, nv), firstKw(more.filter(p => kwOf(p, nv, false)), nv)), used:v}; }
  }
  return {list:[], used:q};
}
// Paraula gramatical? Es mira la paraula escrita (en minúscules i amb els accents), no la paraula de cerca.
function isFuncWord(used, lang, text){ return (FUNC[lang] || FUNC.ca).has(lower(stripPunct(text), lang)); }
function categorize(p, used, lang, text){
  const w = lower(stripPunct(text), lang), q = lower(used, lang);
  const P = PRON[lang] || PRON.ca, F = FUNC[lang] || FUNC.ca;
  if(P.has(w) || P.has(q)) return 'persones';
  if(F.has(w)) return 'misc';
  if(!p) return 'misc';
  const k = p.kw.find(k => norm(k[0]) === q) || p.kw.find(k => norm(k[0]) === w) || p.kw[0];
  return TYPE_CAT[k && k[1]] || 'misc';
}
async function startSearch(b, q){
  q = (q ?? b.query ?? '').trim();
  if(!q){ return; }
  const seq = ++b.searchSeq, lang = S.lang;
  Object.assign(b, {status:'loading', searchedQuery:q, lang, imgErr:false});
  refreshBlock(b.id);
  try{
    const {list, used} = await findPictos(q, lang);
    const cur = find(b.id); if(!cur || cur.searchSeq !== seq) return;
    Object.assign(cur, {pictos:list, idx:0, pictoId:list[0] ? list[0].id : null, status:list.length ? 'ok' : 'none',
      usedQuery:used, approx: norm(used) !== norm(q)});
    const autoCat = categorize(list[0], used, lang, cur.text);
    if(!cur.catManual) cur.cat = autoCat;
    // Totes les paraules porten pictograma automàtic (també pronoms personals, noms propis i expressions com «hola» o «gràcies»),
    // menys les gramaticals: articles, preposicions, conjuncions i nexes, pronoms febles i auxiliars. Aquestes queden només amb text,
    // sense «?» encara que ARASAAC no en tingui, i se'ls pot afegir després amb «Afegir pictograma».
    if(!cur.userPic){ cur.picOff = isFuncWord(used, lang, cur.text); cur.autoOff = cur.picOff; }
    if(cur.memAfter){ cur.memAfter = false; if(list.length) memRemember(cur); }
  }catch(e){
    const cur = find(b.id); if(!cur || cur.searchSeq !== seq) return;
    cur.status = 'error'; noteNetError();
  }

}

function packBlock(b){

function hydrate(o){

}
function restore(data){
  doc = {header:{show:true, name:'', date:'', style:'classic', bw:false, ...data.header}, settings:{...DEF_SETTINGS, ...data.settings}, blocks:(data.blocks||[]).map(hydrate)};
  if(S.selectedId && !find(S.selectedId)) S.selectedId = null;
  renderAll(); syncHeaderInputs();
  doc.blocks.filter(b => b.kind === 'word' && b.status === 'pending').forEach(b => { if(b.noSearch || !(b.searchedQuery || b.query)) b.status = 'none'; else startSearch(b, b.searchedQuery || b.query); });

  pg.foot.textContent = footText(); pg.num.textContent = t('page', {n:i+1});

function paintBlock(b, i){
  let el = els.get(b.id);
  if(!el){
    el = document.createElement('div'); el.dataset.id = b.id;
    if(b.kind === 'word') el.innerHTML = '<div class="lbl"></div><div class="pic"><img alt="" draggable="false"><span class="ph"></span></div>';
    els.set(b.id, el);
    if(b.kind === 'word'){
      const img = el.querySelector('img');
      img.addEventListener('error', () => { const x = find(b.id); if(x && img.getAttribute('src')){ x.imgErr = true; refreshBlock(x.id); } });
      img.addEventListener('load', () => { const x = find(b.id); if(x && x.imgErr){ x.imgErr = false; refreshBlock(x.id); } });
    }
  }
  if(b.kind === 'br'){
    const prev = doc.blocks[i-1];
    el.className = 'blk br' + (!prev || prev.kind === 'br' ? ' blank' : '');
    return el;
  }
  const editing = S.editor && S.editor.id === b.id;
  const own = hasOwn(b);
  const noRes = !own && b.status === 'none' && !b.composing && !b.picOff && !b.noSearch;
  const textOnly = !own && (b.picOff || b.noSearch || noRes);
  const f = eff(b);
  el.className = 'blk' + (b.id === S.selectedId ? ' sel' : '') + (b.composing ? ' composing' : '') + (b.composing && !b.text ? ' empty' : '') + (editing && !b.composing ? ' editing' : '') + (textOnly ? ' textonly' : '') + (noRes ? ' nores' : '') + (SP.hl.has(b.id) ? ' speaking' : '');
  el.style.setProperty('--fs', f.size + 'pt');
  el.title = noRes ? t('st_none', {q:b.searchedQuery || b.query}) : '';
  const lbl = el.firstChild, pic = lbl.nextSibling, img = pic.querySelector('img'), ph = pic.querySelector('.ph');
  let cap = pic.querySelector('.cap'); if(!cap){ cap = document.createElement('span'); cap.className = 'cap'; pic.insertBefore(cap, img); }
  if(editing){ if(edInput.parentNode !== lbl){ lbl.textContent = ''; lbl.appendChild(edInput); } }
  else if(edInput.parentNode === lbl || lbl.textContent !== b.text){ lbl.textContent = b.text; }
  lbl.style.fontSize = f.size + 'pt'; lbl.style.color = f.color;
  lbl.style.fontFamily = fontStack(f.font);
  lbl.style.fontWeight = f.bold ? '700' : '400'; lbl.style.fontStyle = f.italic && hasItalic(f.font) ? 'italic' : 'normal';
  const realPic = !textOnly && !(b.composing && !b.text);
  const st = own ? 'ok' : b.imgErr ? 'error' : b.status;
  lbl.classList.toggle('hasp', realPic && st === 'ok');
  const ct = realPic && st === 'ok' && f.cap !== 'none' ? capText(b, f) : '';
  pic.className = 'pic ' + (realPic ? 'st-' + st + ' cat-' + (b.cat || 'misc') : 'spacer') + (ct ? ' cap-' + f.cap : '');
  if(ct){ const pt = capSize(ct, f); cap.textContent = ct; cap.style.fontFamily = fontStack(f.font); cap.style.fontSize = pt + 'pt'; }
  else if(cap.textContent) cap.textContent = '';
  if(realPic && own){
    if(img.dataset.base !== 'own:' + b.own.src.length + b.own.src.slice(-40)){ img.dataset.base = 'own:' + b.own.src.length + b.own.src.slice(-40); img.src = b.own.src; }
    img.hidden = false; img.alt = b.text;
  } else if(realPic && b.status === 'ok' && b.pictoId != null){
    const src = IMG(b.pictoId); if(img.getAttribute('src') !== src && !(b.imgErr && img.dataset.base === src)){ img.dataset.base = src; img.src = src; }
    img.hidden = !!b.imgErr; img.alt = b.text;
  } else { img.hidden = true; if(img.getAttribute('src')){ img.removeAttribute('src'); img.dataset.base = ''; } }
  const phKey = st + S.lang;
  if(ph.dataset.k !== phKey){ ph.dataset.k = phKey;
    ph.innerHTML = st === 'none' ? '?' : st === 'error' ? icon('refresh-cw') : ''; }
  pic.title = st === 'none' ? t('st_none', {q:b.searchedQuery || b.query}) : st === 'error' ? t('st_error') : '';
  return el;
}

function capSize(txt, f){
  const pic = doc.settings.pictoSize, inner = pic - 2 * (1.2 + 1) - 0.6, base = Math.max(6, pic * 0.45);
  mctx.font = `400 100px ${fontStack(f.font)}`; const w = mctx.measureText(txt).width;
  const fit = w ? inner / (w / 100 * 0.352778) : base;
  return Math.max(4, Math.min(base, Math.floor(fit * 10) / 10));
}

let pagTimer = 0;
function schedulePaginate(){ if(pagTimer) return; pagTimer = requestAnimationFrame(() => { pagTimer = 0; paginate(); }); }
function paginate(){
  if(pagTimer){ cancelAnimationFrame(pagTimer); pagTimer = 0; }
  const hadFocus = document.activeElement === edInput; const pos = edInput.selectionStart;
  S.suppressBlur = true;
  if(!pages.length) makePage(0);
  const ft = footText(); pages.forEach(pg => { if(pg.foot.textContent !== ft) pg.foot.textContent = ft; });
  const items = doc.blocks.map(b => els.get(b.id));
  const bottom = el => el.offsetTop + el.offsetHeight;
  let start = 0, p = 0;
  do{
    const pg = pages[p] || makePage(p);
    const H = pg.flow.clientHeight + 0.5;
    let end = Math.min(items.length, start + (pg.count ?? items.length));
    for(let i = start; i < end; i++){ const want = items[i], have = pg.flow.children[i - start]; if(have !== want) pg.flow.insertBefore(want, have || null); }
    while(pg.flow.children.length > end - start) pg.flow.lastChild.remove();
    let cut = end;
    for(let i = start; i < end; i++){ if(bottom(items[i]) > H){ cut = i; break; } }
    if(cut < end){
      if(cut === start) cut = start + 1;
      for(let i = end - 1; i >= cut; i--) items[i].remove();
      end = cut;
    } else {
      while(end < items.length){ pg.flow.appendChild(items[end]); if(bottom(items[end]) > H && end > start){ items[end].remove(); break; } end++; }
    }
    pg.count = end - start; start = end; p++;
  } while(start < items.length);
  while(pages.length > Math.max(p, 1)){ const pg = pages.pop(); pg.el.remove(); }
  if(pages[0].hint) pages[0].hint.hidden = doc.blocks.some(b => !b.composing || b.text);
  if(hadFocus && document.activeElement !== edInput && edInput.isConnected){ edInput.focus({preventScroll:true}); try{ edInput.setSelectionRange(pos, pos); }catch(e){} }
  S.suppressBlur = false;
  if(S.editor) sizeEditor();
}

  const f = eff(b); mctx.font = `${f.italic && hasItalic(f.font) ? 'italic ' : ''}${f.bold ? 700 : 400} ${f.size * 96 / 72}px ${fontStack(f.font)}`;

  if(doc.settings.caseMode === 'upper' && b.composing) v = v.toLocaleUpperCase();

}

  const out = []; const lines = str.replace(/\r\n?/g, '\n').split('\n');
  lines.forEach((line, li) => {
    if(li > 0) out.push({t:'br'});
    for(const chunk of line.split(/[ \t ]+/)){ if(chunk) out.push({t:'w', text:chunk, punct:!/[\p{L}\p{N}]/u.test(chunk)}); }
  });
  return out;
}
function startCompose(index, initial=''){
  commitEditor(true);
  const b = Object.assign(mkWord(''), {composing:true});
  doc.blocks.splice(Math.max(0, Math.min(index, doc.blocks.length)), 0, b);
  S.selectedId = null; S.editor = {id:b.id, mode:'compose'}; S.composePushed = false;
  edInput.value = '';
  renderAll(); focusEditor();
  if(initial){ edInput.value = initial; onEdInput(); }
}
function focusEditor(){ if(edInput.isConnected){ edInput.focus({preventScroll:true}); const n = edInput.value.length; try{ edInput.setSelectionRange(n, n); }catch(e){} ensureVisible(); } }
function finalizeWord(b){
  b.composing = false; b.text = applyCase(b.text);
  b.query = deriveQuery(b.text, S.lang);
  if(!b.query){ b.noSearch = true; b.status = 'none'; return; }
  if(memApply(b)) return;
  if(b.searchedQuery === b.query && ['loading','ok','none'].includes(b.status)) return;
  startSearch(b, b.query);
}
// Converteix el text escrit en blocs. "consumed" acaba en separador; "rest" és la paraula a mitges.
function applyComposeText(b, consumed, rest){
  const toks = tokenize(consumed);
  if(!toks.length){ b.text = rest; edInput.value = rest; paintBlock(b, idxOf(b.id)); sizeEditor(); schedulePaginate(); return []; }
  if(!S.composePushed){ pushUndo(); S.composePushed = true; }
  clearTimeout(pauseTimer);
  const idx = doc.blocks.indexOf(b);
  const list = []; let reuse = b, prefix = '';
  const lastWordIn = () => { for(let i = list.length - 1; i >= 0; i--){ if(list[i].kind === 'br') return null; if(list[i].kind === 'word') return list[i]; } return null; };
  for(const tk of toks){
    if(tk.t === 'br'){ list.push(mkBr()); continue; }
    if(tk.punct && OPEN.test(tk.text)){ prefix += tk.text; continue; }
    if(tk.punct){
      const prev = lastWordIn() || (list.length === 0 && idx > 0 && doc.blocks[idx-1].kind === 'word' ? doc.blocks[idx-1] : null);
      if(prev){ prev.text += tk.text; continue; }
    }
    let nb; if(reuse){ nb = reuse; reuse = null; nb.text = prefix + tk.text; } else nb = mkWord(prefix + tk.text);
    prefix = ''; nb.composing = false; list.push(nb);
  }
  if(prefix) rest = prefix + rest;
  doc.blocks.splice(idx, 1, ...list);
  list.forEach(x => { if(x.kind === 'word') finalizeWord(x); });
  const c = Object.assign(mkWord(''), {composing:true});
  doc.blocks.splice(idx + list.length, 0, c);
  S.editor = {id:c.id, mode:'compose'}; S.composePushed = false; edInput.value = rest;
  c.text = rest;
  renderAll(); focusEditor(); scheduleSave();
  if(rest) schedulePause(c);
  return list;
}
let pauseTimer = null;
function schedulePause(b){
  clearTimeout(pauseTimer);
  pauseTimer = setTimeout(() => {
    const cur = find(b.id);
    if(cur && cur.composing && S.editor && S.editor.id === cur.id){ const q = deriveQuery(cur.text, S.lang); if(q && q !== cur.searchedQuery) startSearch(cur, q); }
  }, 900);
}
function onEdInput(e){
  if(e && e.isComposing) return;
  if(!S.editor) return;
  const b = find(S.editor.id); if(!b) return;
  const v = edInput.value;
  // La tecla que s'acaba de pitjar (només escriptura normal: no enganxar ni dictar)
  const typed = e && e.inputType === 'insertText' && e.data && Array.from(e.data).length === 1 ? e.data : null;
  if(SP.reading) stopSpeech();
  if(typed) fbLetter(typed);
  if(S.editor.mode === 'edit'){
    if(S.editor.flow && typed && SEP.test(typed) && v.endsWith(typed) && edInput.selectionStart === v.length){ flowFinish(b, /\s/.test(typed) ? v.slice(0, -1) : v, typed); return; }
    if(!S.editPushed){ pushUndo(); S.editPushed = true; }
    b.text = v; paintBlock(b, idxOf(b.id)); sizeEditor(); schedulePaginate(); scheduleSave(); updatePanel(true); updateToolbar(); return;
  }
  if(v.trim() && !S.composePushed){ pushUndo(); S.composePushed = true; }
  if(!SEP.test(v)){ b.text = v; paintBlock(b, idxOf(b.id)); sizeEditor(); schedulePaginate(); if(v) schedulePause(b); return; }
  let last = -1; for(let i = v.length - 1; i >= 0; i--){ if(SEP.test(v[i])){ last = i; break; } }
  const list = applyComposeText(b, v.slice(0, last + 1), v.slice(last + 1));
  const sep = typed || (!e ? v[last] : null);   // sense esdeveniment: teclats de tauleta que acaben una composició
  if(sep && SEP.test(sep)) fbAfter(sep, list);
}
function onEdKey(e){
  if(!S.editor) return;
  if(e.key === 'Escape' && SP.reading){ e.preventDefault(); stopSpeech(); return; }
  const mod = e.ctrlKey || e.metaKey;
  if(mod && /^[zZyY]$/.test(e.key)){ e.preventDefault(); e.stopPropagation(); (e.key.toLowerCase() === 'y' || e.shiftKey) ? redo() : undo(); return; }
  if(mod) return;
  if(S.editor.mode === 'edit'){
    if(S.editor.flow && (e.key === 'Enter' || e.key === 'Tab')){ e.preventDefault(); flowFinish(find(S.editor.id), edInput.value, e.key === 'Enter' ? '\n' : ' '); return; }
    if(e.key === 'Enter' || e.key === 'Escape' || e.key === 'Tab'){ e.preventDefault(); const id = S.editor.id; commitEditor(); select(id); if(e.key === 'Enter') fbWord(id); return; }
    // Retrocés o Supr amb la paraula ja buida: el bloc desapareix i el cursor continua en aquell lloc.
    // Es conserva el pictograma (regla 1) si el text s'ha buidat amb doble clic o «Editar text», o si es manté la tecla premuda.
    if((e.key === 'Backspace' || e.key === 'Delete') && edInput.value === ''){
      const b = find(S.editor.id); if(!b) return;
      e.preventDefault();
      if(hasPicto(b) && (!S.editor.flow || e.repeat)) return;
      removeEmptyWord(b);
    }
    return;
  }
  const b = find(S.editor.id), v = edInput.value, i = doc.blocks.indexOf(b);
  if(e.key === 'Enter'){ e.preventDefault(); if(SP.reading) stopSpeech(); fbAfter('\n', applyComposeText(b, v + '\n', '')); return; }
  if(e.key === 'Escape'){ e.preventDefault(); commitEditor(); stack.focus({preventScroll:true}); return; }
  if(e.key === 'Tab'){ if(v){ e.preventDefault(); fbAfter(' ', applyComposeText(b, v + ' ', '')); } return; }
  if(v !== '') return;
  if(e.key === 'Backspace'){
    e.preventDefault(); const prev = doc.blocks[i-1]; if(!prev) return;
    if(prev.kind === 'br'){ pushUndo(); doc.blocks.splice(i-1, 1); renderAll(); focusEditor(); scheduleSave(); return; }
    // Retrocés sobre la paraula anterior: s'editen les lletres, el pictograma es conserva.
    doc.blocks.splice(i, 1); S.editor = null;
    startEdit(prev, true, true);
    if(prev.text){ pushUndo(); S.editPushed = true; prev.text = Array.from(prev.text).slice(0, -1).join(''); edInput.value = prev.text; paintBlock(prev, idxOf(prev.id)); sizeEditor(); schedulePaginate(); updatePanel(true); scheduleSave(); }
    return;
  }
  if(e.key === 'Delete'){ e.preventDefault(); const nx = doc.blocks[i+1]; if(nx){ pushUndo(); doc.blocks.splice(i+1, 1); renderAll(); focusEditor(); scheduleSave(); } return; }
  if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault(); const j = i + (e.key === 'ArrowLeft' ? -1 : 1);
    if(j < 0 || j >= doc.blocks.length) return;
    doc.blocks.splice(i, 1); doc.blocks.splice(j, 0, b); renderAll(); focusEditor(); return;
  }
}
const hasPicto = b => b.status === 'ok' && b.pictoId != null && !b.picOff && !b.noSearch;
// Acaba la paraula que s'estava corregint després d'esborrar i continua l'escriptura just al darrere (com en un processador de textos).
// El pictograma es conserva (regla 1); si la paraula ha quedat buida i no té pictograma, desapareix.
function flowFinish(b, text, sep){
  if(!b) return;
  if(!S.editPushed){ pushUndo(); S.editPushed = true; }
  b.text = text;
  if(!text.trim() && !hasPicto(b)){ S.editPushed = true; removeEmptyWord(b); }
  else { const at = idxOf(b.id) + 1; commitEditor(true); startCompose(at); }
  if(sep === '\n'){ const c = S.editor && find(S.editor.id); if(c) fbAfter('\n', applyComposeText(c, '\n', '')); }
  else if(text.trim()) fbAfter(sep, [b]);
}
// Treu el bloc que s'està editant (ja sense text) i torna a l'escriptura contínua en el mateix lloc
function removeEmptyWord(b){
  const i = idxOf(b.id); if(i < 0) return;
  if(!S.editPushed) pushUndo();   // si ja s'havien esborrat lletres, un sol Ctrl+Z recupera la paraula sencera
  clearTimeout(pauseTimer);
  S.editor = null; S.editPushed = false; S.selectedId = null;
  if(edInput.parentNode) edInput.remove();
  doc.blocks.splice(i, 1);
  startCompose(i); scheduleSave();
}
function onEdPaste(e){

}

function startEdit(b, keepNoPush, flow){

function commitEditor(silent){

function indexFromPoint(pg, x, y){
  const gap = 5 * 96 / 25.4 * zoomVal() / 2;
  let cand = null;
  for(const el of pg.flow.children){
    const b = find(el.dataset.id); if(!b || b.kind === 'br') { if(b && cand !== null && el.getBoundingClientRect().top < y) cand = idxOf(b.id) + 1; continue; }
    const r = el.getBoundingClientRect(), i = idxOf(b.id);
    if(r.bottom + gap < y){ cand = i + 1; continue; }
    if(r.top - gap > y){ break; }
    if(x < r.left + r.width / 2) return i;
    cand = i + 1;
  }
  if(cand !== null) return cand;
  const first = pg.flow.firstChild; return first ? idxOf(first.dataset.id) : doc.blocks.length;
}

/* ================= Keyboard ================= */
document.addEventListener('keydown', e => {
  const tg = e.target, mod = e.ctrlKey || e.metaKey;
  if(mod && !e.altKey && e.key === 'Enter'){ e.preventDefault(); togglePlay(); return; }
  if(e.key === 'Escape' && SP.reading){ stopSpeech(); if(tg !== edInput) return; }
  if(tg === edInput) return;
  const inField = tg.matches && tg.matches('input, textarea, select');
  if(mod && !e.altKey){
    const k = e.key.toLowerCase();
    if(isLocked() && (k === 's' || k === 'o' || k === 'p')){ e.preventDefault(); return; }
    if(k === 's'){ e.preventDefault(); saveProject(); return; }
    if(k === 'o'){ e.preventDefault(); $('#fileIn').click(); return; }
    if(k === 'p'){ e.preventDefault(); doPrint(); return; }
    if(inField) return;
    if(k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if(k === 'y'){ e.preventDefault(); redo(); return; }
    return;
  }
  if(inField) return;
  const isBtn = tg.closest && tg.closest('button');
  const sel = selectedWord();
  if(sel){
    if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); const at = idxOf(sel.id); deleteBlock(sel.id); S.selectedId = null; startCompose(at); return; }
    if(e.key === 'Enter' || e.key === 'F2'){ if(isBtn && e.key === 'Enter') return; e.preventDefault(); startEdit(sel); return; }
    if(e.key === 'Escape'){ deselect(); return; }
    if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ e.preventDefault(); moveSel(e.key === 'ArrowLeft' ? -1 : 1); return; }
  }
  if(isBtn) return;
  if(e.key.length === 1 && !e.altKey){
    e.preventDefault();
    startCompose(sel ? idxOf(sel.id) + 1 : doc.blocks.length, e.key === ' ' ? '' : e.key);
    if(e.key !== ' ') fbLetter(e.key);
  }
});
document.addEventListener('paste', e => {
  if(e.target === edInput || (e.target.matches && e.target.matches('input, textarea'))) return;
  const text = (e.clipboardData || window.clipboardData).getData('text'); if(!text) return;
  e.preventDefault(); pasteText(text);

/* ================= Block actions ================= */
function deleteBlock(id){
  const i = idxOf(id); if(i < 0) return;
  mutate(() => {
    doc.blocks.splice(i, 1);
    const words = doc.blocks.slice(0, i).reverse().find(b => b.kind === 'word') || doc.blocks.slice(i).find(b => b.kind === 'word');
    S.selectedId = words ? words.id : null;
  });
}
function cycle(b, d){

  mutate(() => {
    b.idx = (b.idx + d + b.pictos.length) % b.pictos.length; b.pictoId = b.pictos[b.idx].id; b.imgErr = false; b.picOff = false; b.userPic = true; b.own = null;
    if(!b.catManual) b.cat = categorize(b.pictos[b.idx], b.usedQuery || b.searchedQuery, b.lang, b.text);
  });
  memRemember(b);
}

/* ================= Imatges pròpies i de la web (Wikimedia Commons) ================= */
const COMMONS = 'https://commons.wikimedia.org/w/api.php';
const webCache = new Map();
const stripHtml = h => { const d = document.createElement('div'); d.innerHTML = String(h || ''); return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
function ownCredit(o){ return `«${o.title}», ${o.author || t('unknownAuthor')}, ${o.license || '?'}`; }
function footText(){
  const seen = new Set(), list = [];
  for(const b of doc.blocks){ if(b.kind === 'word' && hasOwn(b) && b.own.from === 'commons'){ const c = ownCredit(b.own); if(!seen.has(c)){ seen.add(c); list.push(c); } } }
  return t('attrib') + (list.length ? '\n' + t('ownAttrib', {list:list.join('; ')}) : '');
}
function ownMsg(b){ const o = b.own; return o.from === 'commons' ? t('st_web', {t:o.title, a:o.author || t('unknownAuthor'), l:o.license || '?'}) : t('st_own'); }
// Només s'envia la paraula de cerca; mai el nom ni la data
async function searchCommons(q){
  const key = q.toLocaleLowerCase();
  if(webCache.has(key)) return webCache.get(key);
  const u = COMMONS + '?' + new URLSearchParams({action:'query', format:'json', origin:'*', generator:'search', gsrnamespace:'6',
    gsrsearch:q + ' filetype:bitmap|drawing', gsrlimit:'24', prop:'imageinfo', iiprop:'url|mime|extmetadata', iiurlwidth:'400',
    iiextmetadatafilter:'Artist|LicenseShortName|ObjectName', iiextmetadatalanguage:S.lang});
  const r = await fetch(u); if(!r.ok) throw new Error('commons ' + r.status);
  const j = await r.json(); const pagesObj = (j.query && j.query.pages) || {};
  const list = Object.values(pagesObj).sort((a, b) => (a.index || 0) - (b.index || 0)).map(p => {
    const ii = p.imageinfo && p.imageinfo[0]; if(!ii || !ii.thumburl || !/^image\/(jpeg|png|gif|webp|svg\+xml)$/.test(ii.mime || '')) return null;
    const m = ii.extmetadata || {}, v = k => m[k] && m[k].value;
    const title = stripHtml(v('ObjectName')) || String(p.title || '').replace(/^[^:]+:/, '').replace(/\.[a-z0-9]+$/i, '');
    return {thumb:ii.thumburl, page:ii.descriptionurl || '', title, author:stripHtml(v('Artist')).slice(0, 80), license:stripHtml(v('LicenseShortName'))};
  }).filter(Boolean);
  webCache.set(key, list); return list;
}
// Converteix qualsevol imatge en un quadrat de 360 px (com els pictogrames), sense retallar-la
async function toSquare(blob){
  const url = URL.createObjectURL(blob);
  try{
    const im = new Image(); im.src = url; await im.decode();
    const w = im.naturalWidth || 300, h = im.naturalHeight || 300, N = 360, k = Math.min(N / w, N / h);
    const cv = document.createElement('canvas'); cv.width = cv.height = N; const cx = cv.getContext('2d');
    const dw = w * k, dh = h * k; cx.drawImage(im, (N - dw) / 2, (N - dh) / 2, dw, dh);
    let out = cv.toDataURL('image/png');
    if(out.length > 200000){ const c2 = document.createElement('canvas'); c2.width = c2.height = N; const x2 = c2.getContext('2d');
      x2.fillStyle = '#fff'; x2.fillRect(0, 0, N, N); x2.drawImage(cv, 0, 0); out = c2.toDataURL('image/jpeg', 0.86); }
    return out;
  } finally { URL.revokeObjectURL(url); }
}
/* ================= Imatges recordades ================= */
// Quan la mestra posa una imatge pròpia o tria a mà un pictograma d'ARASAAC, es recorda per a aquella paraula (en minúscules,
// amb accents, separat per idioma) i surt sola cada vegada que s'escriu. Es guarda al navegador (funciona sense internet)
// i es pot passar a un altre aparell amb un fitxer. Els documents desats no canvien.
const MEM = {CACHE:'pictoescriu-imatges-1', KEY:'https://pictoescriu.local/imatges/', map:new Map()};
const memWord = (text, lang) => lower(stripPunct(text || ''), lang);
const memKey = (lang, w) => lang + '|' + w;
async function memLoad(){
  if(!pvCanStore()) return;
  try{ const c = await caches.open(MEM.CACHE); for(const r of await c.keys()){ const e = await (await c.match(r)).json(); if(e && e.w && e.lang) MEM.map.set(memKey(e.lang, e.w), e); } }catch(e){}
}
function memGet(b){ const lang = b.lang || S.lang, w = memWord(b.text, lang); return w ? MEM.map.get(memKey(lang, w)) || null : null; }
async function memPut(e){
  MEM.map.set(memKey(e.lang, e.w), e);
  try{ await (await caches.open(MEM.CACHE)).put(MEM.KEY + encodeURIComponent(memKey(e.lang, e.w)), new Response(JSON.stringify(e), {headers:{'Content-Type':'application/json'}})); }catch(err){}
}
async function memDel(lang, w){ MEM.map.delete(memKey(lang, w)); try{ await (await caches.open(MEM.CACHE)).delete(MEM.KEY + encodeURIComponent(memKey(lang, w))); }catch(e){} }
function memRemember(b){
  b = b && find(b.id); if(!b || b.kind !== 'word') return;
  const lang = b.lang || S.lang, w = memWord(b.text, lang); if(!w) return;
  if(hasOwn(b)) memPut({w, lang, own:b.own, cat:b.cat});
  else if(b.status === 'ok' && b.pictoId != null && !b.picOff) memPut({w, lang, pid:b.pictoId, pictos:b.pictos, idx:b.idx, cat:b.cat, used:b.usedQuery || b.searchedQuery});
  else return;
  if(b.id === S.selectedId) updatePanel();
}
// En acabar d'escriure una paraula: si n'hi ha una de recordada, es posa directament
function memApply(b){
  const e = memGet(b); if(!e) return false;
  if(e.own){
    Object.assign(b, {own:{...e.own}, picOff:false, autoOff:false, userPic:true, imgErr:false});
    if(!b.catManual && e.cat) b.cat = e.cat;
    return false;   // es continua cercant a ARASAAC (sense canviar la imatge), per si després es vol triar un pictograma
  }
  const pictos = Array.isArray(e.pictos) && e.pictos.length ? e.pictos : [{id:e.pid, kw:[]}];
  const idx = Math.max(0, pictos.findIndex(x => x.id === e.pid));
  Object.assign(b, {pictos, idx, pictoId:e.pid, status:'ok', usedQuery:e.used || b.query, searchedQuery:b.query, approx:false, picOff:false, autoOff:false, userPic:true, imgErr:false, own:null});
  if(!b.catManual && e.cat) b.cat = e.cat;
  return true;
}
function openMemDialog(){
  if($('#memOv')) return;
  let note = '';
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'memOv';
  const render = () => {
    const items = [...MEM.map.values()].sort((a, b) => a.w.localeCompare(b.w));
    ov.innerHTML = `<div class="dialog voice" role="dialog" aria-modal="true" aria-labelledby="mdT"><h2 id="mdT">${esc(t('memTitle'))}</h2>
      <p class="msg">${esc(t('memHow'))}</p>

        <button class="btn icon-only" data-del="${esc(memKey(e.lang, e.w))}" title="${esc(t('memForget'))}" aria-label="${esc(t('memForget'))}">${icon('trash-2')}</button></div>`).join('')}</div>` : `<p class="msg">${esc(t('memNone'))}</p>`}
      <p class="msg" id="mdMsg">${esc(note)}</p>
      <div class="acts"><button class="btn outline" id="mdExport"${items.length ? '' : ' disabled'}>${icon('save')}${esc(t('memExport'))}</button><button class="btn outline" id="mdImport">${icon('folder-open')}${esc(t('memImport'))}</button><button class="btn primary" id="mdClose">${esc(t('ok'))}</button></div></div>`;
    ov.querySelectorAll('[data-del]').forEach(x => x.onclick = async () => { const [lang, w] = x.dataset.del.split(/\|(.*)/s); await memDel(lang, w); render(); updatePanel(); });
    ov.querySelector('#mdExport').onclick = () => { downloadBlob(new Blob([JSON.stringify({app:'PictoEscriu', kind:'imatges', format:1, items:[...MEM.map.values()]})], {type:'application/json'}), 'imatges-pictoescriu.json'); note = t('memExported'); render(); };
    ov.querySelector('#mdImport').onclick = () => $('#memIn').click();
    ov.querySelector('#mdClose').onclick = close;
  };
  const close = () => { ov.remove(); $('#memIn').onchange = null; updatePanel(); };
  $('#memIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if(!f) return;
    const fr = new FileReader(); fr.onload = async () => {
      try{ const d = JSON.parse(fr.result); if(!d || d.app !== 'PictoEscriu' || d.kind !== 'imatges' || !Array.isArray(d.items)) throw new Error('format');
        let n = 0; for(const x of d.items){ if(x && x.w && (x.lang === 'ca' || x.lang === 'es') && ((x.own && /^data:image\//.test(String(x.own.src))) || Number.isFinite(x.pid))){ await memPut(x); n++; } }
        note = t('memImported', {n}); }catch(err){ note = t('memBadFile'); }
      render(); };
    fr.readAsText(f); };
  render();
  ov.addEventListener('keydown', e => { if(e.key === 'Escape'){ e.stopPropagation(); close(); } });
  ov.addEventListener('click', e => { if(e.target === ov) close(); });
  document.body.appendChild(ov); ov.querySelector('#mdClose').focus();
}
function setOwn(b, own){
  mutate(() => { b.own = own; b.picOff = false; b.autoOff = false; b.userPic = true; b.imgErr = false;
    if(!b.catManual && (!b.cat || b.cat === 'misc') && b.status !== 'ok') b.cat = 'substantius'; });
  memRemember(b);
  toast(t('ownAdded'));
}
async function ownFromBlob(b, blob, from, meta){
  if(!blob || !/^image\//.test(blob.type || 'image/')) { toast(t('ownErr'), {kind:'error'}); return; }
  try{ const src = await toSquare(blob); if(find(b.id)) setOwn(b, {src, from, ...(meta || {})}); }
  catch(e){ toast(t('ownErr'), {kind:'error'}); }
}

  const q = $('#pWebQ'); if(document.activeElement !== q && q.dataset.for !== b.id){ q.dataset.for = b.id; q.value = deriveQuery(b.text, S.lang); }

  q = (q || '').trim(); if(!q) return;

/* ================= Dialogs & toasts ================= */
function toast(msg, o={}){
  const el = document.createElement('div'); el.className = 'toast' + (o.kind === 'error' ? ' error' : '');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  const close = () => { el.remove(); o.onClose && o.onClose(); };
  if(o.action){ const b = document.createElement('button'); b.textContent = o.action.label; b.onclick = () => { close(); o.action.fn(); }; el.appendChild(b); }
  $('#toasts').appendChild(el); setTimeout(close, o.timeout || 3500);
}
function dialog({title, body, actions, extra}){
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="dialog" role="dialog" aria-modal="true"><h2>${esc(title)}</h2>${body.split('\n').map(p => `<p>${esc(p)}</p>`).join('')}${extra || ''}<div class="acts"></div></div>`;

    warnNoVoice(ch.lang);
    if(VS.flow === 'word'){
      // Paraula a paraula: el ressaltat sempre és exacte
      for(const it of ch.items){
        if(token !== SP.seq) return;
        await utter(it.s, ch.lang, {start:() => { if(token === SP.seq) setHL([it.id]); }});
        if(token !== SP.seq) return;
        await wait(180 / VS.rate);
      }
    } else {
      // Natural: tota la frase alhora; la veu avisa de cada paraula (si ho sap fer) i la ressaltem
      let text = ''; const offs = [];
      ch.items.forEach(it => { if(text) text += ' '; offs.push(text.length); text += it.s; });
      const key = voiceKey(pickVoice(ch.lang)); let got = false, timer = null;
      await utter(text, ch.lang, {
        start:() => {
          if(token !== SP.seq) return;
          if(ids.length === 1 || SP.bnd[key] === false){ setHL(ids); return; }
          setHL([ids[0]]);
          if(SP.bnd[key] !== true) timer = setTimeout(() => { if(!got && token === SP.seq){ SP.bnd[key] = false; setHL(ids); } }, 1500 / VS.rate);
        },
        boundary:e => {
          if(token !== SP.seq || (e.name && e.name !== 'word')) return;
          got = true; SP.bnd[key] = true; clearTimeout(timer);
          let k = 0; while(k + 1 < offs.length && offs[k + 1] <= e.charIndex) k++;
          setHL([ids[k]]);
        }
      });
      clearTimeout(timer);
      if(!got && ids.length > 1 && SP.bnd[key] === undefined) SP.bnd[key] = false;
    }
    if(token !== SP.seq) return;
    setHL([]);
    if(ci < chunks.length - 1) await wait(250 / VS.rate);
  }
}
function stopSpeech(){
  SP.seq++; const was = SP.reading; SP.reading = false;
  if(hasSynth()){ try{ synth().cancel(); }catch(e){} }
  pvStop(); sndStop();
  setHL([]); if(was) updatePlayBtn();
}
// Interromp el que s'estigui dient i en comença un de nou
async function begin(){
  const busy = !!PV.src || !!SND.src || (hasSynth() && (synth().speaking || synth().pending));
  stopSpeech(); const token = SP.seq;
  if(hasSynth()){ try{ synth().resume(); }catch(e){} }
  if(busy) await wait(60);   // alguns navegadors perden la frase nova si es diu just després d'interrompre
  return token;
}
async function speakBlocks(blocks, reading){
  if(!canSpeak()){ toast(t('noSpeech'), {kind:'error'}); return; }
  const chunks = chunksOf(blocks); if(!chunks.length) return;
  SP.active++;
  try{
    const token = await begin(); if(token !== SP.seq) return;
    SP.reading = !!reading; updatePlayBtn();
    await speakChunks(chunks, token);
    if(token === SP.seq){ SP.reading = false; setHL([]); updatePlayBtn(); }
  } finally { SP.active--; }
}
async function sayText(text, lang){
  if(!canSpeak() || !text) return;
  SP.active++;
  try{ const token = await begin(); if(token === SP.seq) await utter(text, lang); }
  finally { SP.active--; }
}
// Botó ▶: tot el document, o des de la paraula seleccionada. Mai la capçalera.
function togglePlay(){
  if(SP.reading){ stopSpeech(); return; }
  if(!canSpeak()){ toast(t('noSpeech'), {kind:'error'}); return; }
  const sel = selectedWord(), list = doc.blocks.slice(sel ? idxOf(sel.id) : 0);
  if(!chunksOf(list).length){ toast(t('nothingToRead')); return; }

}
function updatePlayBtn(){

    const btn = $(bs), pi = btn.querySelector('.pi');

    if(pi.dataset.k !== ic){ pi.dataset.k = ic; pi.innerHTML = icon(ic); }

function applyVoiceUI(){

/* ---- Pantalla bloquejada per a l'alumne ---- */
// Amaga les barres i el panell i posa la pantalla completa. No és una barrera de seguretat: és perquè l'alumne no toqui
// els botons de la mestra. Es desbloqueja prement el cadenat 7 vegades seguides (menys d'1,5 s entre tocs).
const LOCK = {taps:0, last:0, timer:null, N:7, GAP:1500};
function isLocked(){ return document.body.classList.contains('locked'); }
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
const fsOK = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function goFull(){ const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
  try{ const r = f && f.call(el); if(r && r.catch) r.catch(() => {}); }catch(e){} }
function setLocked(on, quiet){
  document.body.classList.toggle('locked', !!on); $('#lockBar').hidden = !on; LS.set('locked', !!on);
  LOCK.taps = 0; $('#lockDots').textContent = '';
  if(on){
    document.querySelectorAll('.overlay').forEach(o => o.remove()); voiceDlg = null;
    if(S.selectedId && !(S.editor && S.editor.id === S.selectedId)){ S.selectedId = null; renderAll(); }
    if(!quiet) goFull();
    if(!S.editor) startCompose(doc.blocks.length); else focusEditor();
  } else {
    try{ if(fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); }catch(e){}
    if(!quiet) toast(t('unlocked'));
  }
  updateFullBtn(); updateToolbar();
}
function updateFullBtn(){ document.body.classList.toggle('is-full', !!fsEl() || !fsOK()); }
function unlockTap(){
  const now = performance.now();
  LOCK.taps = now - LOCK.last < LOCK.GAP ? LOCK.taps + 1 : 1; LOCK.last = now;
  clearTimeout(LOCK.timer); LOCK.timer = setTimeout(() => { LOCK.taps = 0; $('#lockDots').textContent = ''; }, LOCK.GAP + 200);
  if(LOCK.taps >= LOCK.N){ setLocked(false); return; }
  // Des del tercer toc es veu quants en falten (perquè la mestra sàpiga que funciona)
  $('#lockDots').textContent = LOCK.taps >= 3 ? '●'.repeat(LOCK.taps) + '○'.repeat(LOCK.N - LOCK.taps) : '';
}

/* ---- Sons de les lletres gravats (per la mestra o la logopeda) i «Lletrejar» ---- */
// Cada so es grava una vegada amb el micròfon i es guarda al navegador (Cache Storage). Es pot desar en un fitxer per passar-lo a un altre ordinador.
// Taula lletra → so: el so més habitual de cada lletra o grup de lletres (ny, ll, l·l, rr, ss, qu, gu, tx, ix, tj/tg; la h no sona). Pendent de validar amb la logopeda.
const SOUNDS = {
  ca:[['a','a, à','pa'], ['e','e, é, è','te'], ['i','i, í, ï, y','pi'], ['o','o, ó, ò','os'], ['u','u, ú, ü','lluna'], ['p','p','pa'], ['b','b, v','bota'], ['t','t','te'],
    ['d','d','dit'], ['k','c, qu, k, q','casa'], ['g','g, gu','gat'], ['m','m','mà'], ['n','n','nas'], ['ny','ny','nyam'], ['f','f','foc'], ['s','s, ss, ç, c (+e, i)','sol'],
    ['z','z','zero'], ['sh','x, ix','xocolata'], ['zh','j, g (+e, i)','joc'], ['tsh','tx','cotxe'], ['dzh','tj, tg','platja'], ['l','l, l·l','lila'], ['ll','ll','lluna'],
    ['r','r','pera'], ['rr','rr, r a l\'inici','rosa'], ['w','w','web']],
  es:[['a','a, á','casa'], ['e','e, é','té'], ['i','i, í, y final','pino'], ['o','o, ó','oso'], ['u','u, ú, ü','uva'], ['p','p','pato'], ['b','b, v','bota'], ['t','t','taza'],
    ['d','d','dedo'], ['k','c, qu, k','casa'], ['g','g, gu','gato'], ['m','m','mamá'], ['n','n','nube'], ['ny','ñ','niño'], ['f','f','foca'], ['th','z, c (+e, i)','zapato'],
    ['s','s','sol'], ['x','j, g (+e, i)','jirafa'], ['ch','ch','chocolate'], ['y','y, ll','yate'], ['l','l','luna'], ['r','r','pera'], ['rr','rr, r al inicio','perro'],
    ['ks','x','taxi'], ['w','w','web']]
};
const SND = {CACHE:'pictoescriu-sons-1', KEY:'https://pictoescriu.local/sons/', have:{ca:new Set(), es:new Set()}, dec:new Map(), src:null, done:null, told:false};
const sndUrl = (lang, k) => SND.KEY + lang + '/' + k;
const actx = () => { if(!PV.ctx){ try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){} PV.ctx = new (window.AudioContext || window.webkitAudioContext)(); } return PV.ctx; };
// Divideix una paraula en lletres o grups de lletres amb el so de cadascun (null: no sona, com la h)
function spellUnits(word, lang){
  const w = String(word || '').replace(/[’`´]/g, "'"), lw = w.toLocaleLowerCase(lang), out = [];
  const isL = ch => /\p{L}/u.test(ch || ''), soft = ch => /^[eéèêiíìïy]$/.test(ch || ''), base = ch => ch.normalize('NFD').replace(/[̀-ͯ]/g, '');
  const keys = new Set(SOUNDS[lang].map(x => x[0]));
  for(let i = 0; i < lw.length;){
    const c = lw[i], n = lw[i + 1], n2 = lw[i + 2], first = i === 0 || !isL(lw[i - 1]);
    let len = 1, snd;
    if(lang === 'es'){
      if(c === 'c' && n === 'h'){ len = 2; snd = 'ch'; }
      else if(c === 'l' && n === 'l'){ len = 2; snd = 'y'; }
      else if(c === 'r' && n === 'r'){ len = 2; snd = 'rr'; }
      else if((c === 'q' || c === 'g') && n === 'u' && soft(n2)){ len = 2; snd = c === 'q' ? 'k' : 'g'; }
      else if(c === 'c') snd = soft(n) ? 'th' : 'k';
      else if(c === 'g') snd = soft(n) ? 'x' : 'g';
      else snd = {j:'x', z:'th', h:null, 'ñ':'ny', v:'b', x:'ks', q:'k', r:first ? 'rr' : 'r', y:isL(n) ? 'y' : 'i'}[c];
    } else {
      if(c === 'l' && (n === '·' || n === '.') && n2 === 'l'){ len = 3; snd = 'l'; }
      else if(c === 'n' && n === 'y'){ len = 2; snd = 'ny'; }
      else if(c === 'l' && n === 'l'){ len = 2; snd = 'll'; }
      else if(c === 'r' && n === 'r'){ len = 2; snd = 'rr'; }
      else if(c === 's' && n === 's'){ len = 2; snd = 's'; }
      else if(c === 't' && n === 'x'){ len = 2; snd = 'tsh'; }
      else if(c === 'i' && n === 'x' && /[aeouàèéòóú]/.test(lw[i - 1] || '')){ len = 2; snd = 'sh'; }
      else if(c === 't' && (n === 'j' || (n === 'g' && soft(n2)))){ len = 2; snd = 'dzh'; }
      else if((c === 'q' || c === 'g') && n === 'u' && soft(n2)){ len = 2; snd = c === 'q' ? 'k' : 'g'; }
      else if(c === 'c') snd = soft(n) ? 's' : 'k';
      else if(c === 'g') snd = soft(n) ? 'zh' : 'g';
      else snd = {'ç':'s', j:'zh', h:null, x:'sh', v:'b', q:'k', y:'i', 'ñ':'ny', r:first ? 'rr' : 'r'}[c];
    }
    if(snd === undefined){ const bc = base(c); snd = keys.has(bc) ? bc : null; }
    out.push({start:i, end:i + len, txt:w.slice(i, i + len), snd:isL(c) ? snd : null, letter:isL(c)});
    i += len;
  }
  return out;
}
// So d'una lletra pitjada sola (sense saber la lletra següent)
function letterSound(ch, lang){ if(ch === 'r') return 'r'; if(lang === 'es' && ch === 'y') return 'y'; const u = spellUnits(ch, lang)[0]; return u ? u.snd : null; }
async function sndIndex(){
  if(!pvCanStore()) return;
  try{ const c = await caches.open(SND.CACHE); for(const r of await c.keys()){ const [lang, k] = r.url.slice(SND.KEY.length).split('/'); if(SND.have[lang]) SND.have[lang].add(decodeURIComponent(k)); } }catch(e){}
  if(voiceDlg) voiceDlg.render();
}
async function sndPut(lang, k, blob){ await (await caches.open(SND.CACHE)).put(sndUrl(lang, k), new Response(blob, {headers:{'Content-Type':blob.type || 'audio/webm'}})); SND.have[lang].add(k); SND.dec.delete(lang + '/' + k); }
async function sndDel(lang, k){ await (await caches.open(SND.CACHE)).delete(sndUrl(lang, k)); SND.have[lang].delete(k); SND.dec.delete(lang + '/' + k); }
async function sndBuffer(lang, k){
  const id = lang + '/' + k; if(SND.dec.has(id)) return SND.dec.get(id);
  const r = await (await caches.open(SND.CACHE)).match(sndUrl(lang, k)); if(!r) return null;
  const buf = await actx().decodeAudioData(await r.arrayBuffer());
  // Es retalla el silenci del principi i del final, perquè els sons sonin seguits
  const d = buf.getChannelData(0); let mx = 0; for(let i = 0; i < d.length; i++){ const v = Math.abs(d[i]); if(v > mx) mx = v; }
  const th = mx * 0.08; let a = 0, z = d.length - 1; while(a < z && Math.abs(d[a]) < th) a++; while(z > a && Math.abs(d[z]) < th) z--;
  const pad = Math.round(buf.sampleRate * 0.03), from = Math.max(0, a - pad), to = Math.min(d.length, z + pad);
  const res = {buf, at:from / buf.sampleRate, dur:Math.max(0.05, (to - from) / buf.sampleRate)};
  SND.dec.set(id, res); return res;
}
function sndPlay(lang, k){
  return new Promise(async res => {
    let fin = false; const done = () => { if(fin) return; fin = true; if(SND.done === done) SND.done = null; res(); };
    if(SND.done) SND.done(); SND.done = done;
    try{
      const x = await sndBuffer(lang, k); if(!x || fin) return done();
      const ctx = actx(); if(ctx.state === 'suspended'){ try{ await ctx.resume(); }catch(e){} }
      if(fin) return;
      const src = ctx.createBufferSource(); src.buffer = x.buf; src.connect(ctx.destination); SND.src = src;
      src.onended = () => { if(SND.src === src) SND.src = null; done(); };
      src.start(0, x.at, x.dur);
      setTimeout(() => { if(SND.src === src) SND.src = null; done(); }, x.dur * 1000 + 1500);
    }catch(e){ console.warn('So gravat:', e); done(); }
  });
}
function sndStop(){ const src = SND.src; SND.src = null; if(src){ try{ src.onended = null; src.stop(); }catch(e){} } if(SND.done) SND.done(); }
async function sndSay(lang, k){ SP.active++; try{ const token = await begin(); if(token === SP.seq) await sndPlay(lang, k); } finally { SP.active--; } }
// Marca la lletra que sona dins la paraula escrita (només a la pantalla; no canvia cap mida)
function markLetters(b, a, z){
  const el = els.get(b.id), lbl = el && el.querySelector('.lbl'); if(!lbl || lbl.contains(edInput)) return;
  const tx = b.text || '';
  if(a < 0){ if(lbl.querySelector('.spell-on')) lbl.textContent = tx; return; }
  lbl.innerHTML = esc(tx.slice(0, a)) + '<span class="spell-on">' + esc(tx.slice(a, z)) + '</span>' + esc(tx.slice(z));
}
// «Lletrejar»: cada lletra (o grup) amb el seu so gravat, o el nom si encara no està gravat; després, la paraula sencera
async function spellBlock(b){
  if(!b || b.kind !== 'word' || !(b.text || '').trim() || (S.editor && S.editor.id === b.id)) return;
  const lang = (b.lang || S.lang) === 'es' ? 'es' : 'ca', units = spellUnits(b.text, lang);
  if(!SND.have[lang].size && !SND.told){ SND.told = true; toast(t('sndNone'), {timeout:9000, action:{label:t('voiceBtn'), fn:openVoiceDialog}}); }
  SP.active++;
  try{
    const token = await begin(); if(token !== SP.seq) return;
    SP.reading = true; updatePlayBtn(); setHL([b.id]);
    for(const u of units){
      if(token !== SP.seq) break;
      if(!u.letter) continue;
      markLetters(b, u.start, u.end);
      if(u.snd && SND.have[lang].has(u.snd)) await sndPlay(lang, u.snd);
      else if(u.snd) await utter([...u.txt.toLocaleLowerCase(lang)].map(ch => LETTERS[lang][ch] || ch).join(' '), lang);
      else await wait(450);   // la h no sona
      if(token !== SP.seq) break;
      await wait(260 / VS.rate);
    }
    markLetters(b, -1, -1);
    if(token === SP.seq){ await wait(150); await utter(spokenText(b), lang, {start:() => { if(token === SP.seq) setHL([b.id]); }}); }
    if(token === SP.seq){ SP.reading = false; setHL([]); updatePlayBtn(); }
  } finally { SP.active--; markLetters(b, -1, -1); }
}

/* ---- Ajuda mentre l'alumne escriu (només en mode alumne) ---- */
function fbLetter(ch){
  if(!VS.student || !VS.letters || !ch) return;
  const lang = S.lang === 'es' ? 'es' : 'ca', c = ch.toLocaleLowerCase(lang);
  if(!/^[\p{L}\p{N}·]$/u.test(c)) return;
  if(VS.letterKind === 'sound' && /\p{L}/u.test(c)){
    const k = letterSound(c, lang);
    if(k === null) return;   // la h no sona
    if(SND.have[lang].has(k)){ sndSay(lang, k); return; }
  }
  sayText(LETTERS[lang][c] || c, lang);
}
// La frase que acaba al bloc «li»: enrere fins al punt anterior, un salt de línia o el principi
function sentenceAt(li){
  const out = [];
  for(let i = li; i >= 0; i--){ const b = doc.blocks[i]; if(b.kind === 'br' || (i !== li && ENDS.test(b.text || ''))) break; out.unshift(b); }
  return out;
}
// Després d'un espai, un signe o un Retorn: diu la paraula acabada o llegeix la frase
function fbAfter(sep, list){
  if(!VS.student || !S.editor) return;
  let li = idxOf(S.editor.id) - 1;
  if(sep === '\n'){
    li--; const w = doc.blocks[li]; if(!w || w.kind !== 'word') return;
    if(VS.sentences){ if(!ENDS.test(w.text || '')) speakBlocks(sentenceAt(li)); return; }
    if(VS.words && list.includes(w)) speakBlocks([w]);
    return;
  }
  const w = doc.blocks[li]; if(!w || w.kind !== 'word') return;
  if(VS.sentences && /[.!?…]/.test(sep) && ENDS.test(w.text || '')){ speakBlocks(sentenceAt(li)); return; }
  if(VS.words && list.includes(w)) speakBlocks([w]);
}
function fbWord(id){ const b = find(id); if(VS.student && VS.words && b) speakBlocks([b]); }

/* ---- Finestra «Sons de les lletres»: gravar, escoltar, esborrar, desar en un fitxer i obrir-lo ---- */
function blobToDataURL(blob){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); }); }
function openSoundsDialog(){
  if(!pvCanStore() || !window.MediaRecorder){ toast(t('sndNoStore'), {kind:'error'}); return; }
  if($('#sndOv')) return;
  let lang = S.lang === 'es' ? 'es' : 'ca', rec = null, note = '';
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.id = 'sndOv';
  const msg = m => { note = m; const el = ov.querySelector('#sdMsg'); if(el) el.textContent = m; };
  const stopRec = () => { if(rec && rec.mr.state !== 'inactive') rec.mr.stop(); };
  const startRec = async k => {
    if(rec){ stopRec(); return; }
    let stream;
    try{ stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:true}}); }
    catch(e){ msg(t('sndMicErr')); return; }
    const mr = new MediaRecorder(stream), parts = [];
    rec = {k, mr, timer:null};
    mr.ondataavailable = e => { if(e.data && e.data.size) parts.push(e.data); };
    mr.onstop = async () => {
      stream.getTracks().forEach(tr => tr.stop()); clearTimeout(rec && rec.timer); rec = null;
      const blob = new Blob(parts, {type:mr.mimeType || 'audio/webm'});
      if(blob.size){ await sndPut(lang, k, blob); msg(''); render(); sndPlay(lang, k); } else render();
    };
    mr.start(); rec.timer = setTimeout(stopRec, 2500); msg(t('sndRecording')); render();
  };
  const exportAll = async () => {
    const c = await caches.open(SND.CACHE), out = {app:'PictoEscriu', kind:'sons', format:1, sons:{ca:{}, es:{}}};
    for(const l of ['ca', 'es']) for(const k of SND.have[l]){ const r = await c.match(sndUrl(l, k)); if(r) out.sons[l][k] = await blobToDataURL(await r.blob()); }
    downloadBlob(new Blob([JSON.stringify(out)], {type:'application/json'}), 'sons-pictoescriu.json'); msg(t('sndExported'));
  };
  const importFile = file => {
    const fr = new FileReader();
    fr.onload = async () => {
      try{
        const d = JSON.parse(fr.result); if(!d || d.app !== 'PictoEscriu' || d.kind !== 'sons' || !d.sons) throw new Error('format');
        let n = 0;
        for(const l of ['ca', 'es']) for(const [k, url] of Object.entries(d.sons[l] || {})){
          if(!SOUNDS[l].some(x => x[0] === k) || !/^data:audio\//.test(String(url))) continue;
          await sndPut(l, k, await (await fetch(url)).blob()); n++;
        }
        msg(t('sndImported', {n})); render();
      }catch(e){ msg(t('sndBadFile')); }
    };
    fr.readAsText(file);
  };
  const render = () => {
    const a = document.activeElement, keep = a && ov.contains(a) ? Object.entries(a.dataset).map(([k, v]) => `[data-${k}="${v}"]`).join('') || (a.id ? '#' + a.id : '') : '';
    ov.innerHTML = `<div class="dialog voice snd" role="dialog" aria-modal="true" aria-labelledby="sdT"><h2 id="sdT">${esc(t('sndTitle'))}</h2>
      <p class="msg">${esc(t('sndHow'))}</p>
      <div class="seg" id="sdLang" role="group"><button data-lang="ca" aria-pressed="${lang === 'ca'}">Català</button><button data-lang="es" aria-pressed="${lang === 'es'}">Castellano</button></div>
      <div class="sndlist">${SOUNDS[lang].map(([k, letters, ex]) => { const has = SND.have[lang].has(k), on = rec && rec.k === k;
        return `<div class="sndrow${has ? ' has' : ''}"><span class="sndl"><b>${esc(letters)}</b> <span class="msg">${esc(t('sndAsIn', {w:ex}))}</span></span>
          <button class="btn ${on ? 'rec' : 'outline'}" data-rec="${k}">${icon(on ? 'square' : 'mic')}${esc(t(on ? 'sndStop' : has ? 'sndAgain' : 'sndRec'))}</button>
