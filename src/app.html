/* ================= PDF ================= */
const imgData = new Map();
async function fetchDataURL(url){
  const r = await fetch(url, {mode:'cors'}); if(!r.ok) throw new Error('img');
  const bl = await r.blob();
  return await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(bl); });
}
async function loadImages(ids){
  const failed = [];
  await Promise.all(ids.map(id => limited(async () => {
    if(imgData.has(id)) return;
    try{ imgData.set(id, await fetchDataURL(IMG(id))); }
    catch(e){ try{ imgData.set(id, await fetchDataURL(`${API}/${id}?download=false`)); } catch(e2){ failed.push(id); } }
  })));
  return failed;
}
function hexRgb(c){ const m = String(c).match(/^#?([\da-f]{2})([\da-f]{2})([\da-f]{2})$/i); return m ? [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)] : [0,0,0]; }
// Mètriques verticals tal com les fa servir el navegador, perquè el PDF col·loqui el text al mateix lloc que la pantalla
const fmCache = new Map();
function fontMetrics(f){
  const key = f.font + (f.bold ? 'b' : '') + (f.italic ? 'i' : '');
  if(!fmCache.has(key)){
    mctx.font = `${f.italic && hasItalic(f.font) ? 'italic ' : ''}${f.bold ? 700 : 400} 100px ${fontStack(f.font)}`;
    const m = mctx.measureText('Hg');
    fmCache.set(key, m.fontBoundingBoxAscent ? {a:m.fontBoundingBoxAscent / 100, d:m.fontBoundingBoxDescent / 100} : {a:0.93, d:0.24});
  }
  return fmCache.get(key);
}
let busyOv = null;
function showBusy(msg){ busyOv = document.createElement('div'); busyOv.className = 'overlay'; busyOv.innerHTML = `<div class="dialog" style="max-width:340px;flex-direction:row;align-items:center"><span class="spin"></span><p>${esc(msg)}</p></div>`; document.body.appendChild(busyOv); }
function hideBusy(){ if(busyOv){ busyOv.remove(); busyOv = null; } }
async function exportPDF(force){
  commitEditor(true); deselect(); paginate(); stopSpeech();
  if(!window.jspdf || !window.jspdf.jsPDF){ toast(t('pdfLib'), {kind:'error'}); return; }
  showBusy(t('pdfPrep'));
  try{
    await document.fonts.ready;
    const words = doc.blocks.filter(b => b.kind === 'word' && showsArasaac(b));
    const failed = await loadImages([...new Set(words.map(b => b.pictoId))]);
    if(failed.length && !force){
      hideBusy();
      const list = words.filter(b => failed.includes(b.pictoId)).map(b => '«' + (b.text || b.query) + '»').slice(0, 6).join(', ');
      const r = await dialog({title:t('pdfFailT'), body:t('pdfFailB', {n:failed.length, list}),
        actions:[{label:t('cancel'), v:0}, {label:t('pdfAnyway'), v:2}, {label:t('retry'), v:1, primary:true}]});
      if(r.v === 1) return exportPDF(false); if(r.v === 2) return exportPDF(true); return;
    }
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
    const used = new Set(['roboto', ...doc.blocks.filter(b => b.kind === 'word').map(b => eff(b).font)]);
    for(const k of used){ const fam = FONTS[k]; if(!fam) continue;
      for(const [st, b64] of Object.entries(fam.faces)){ pdf.addFileToVFS(`${k}-${st}.ttf`, b64); pdf.addFont(`${k}-${st}.ttf`, k, st); } }
    const pdfFont = (k, bold, italic) => {
      if(k === 'arial') return ['helvetica', bold && italic ? 'bolditalic' : bold ? 'bold' : italic ? 'italic' : 'normal'];
      const fam = FONTS[k] ? k : 'roboto', faces = FONTS[fam].faces;
      const want = bold && italic ? 'bolditalic' : bold ? 'bold' : italic ? 'italic' : 'normal';
      return [fam, faces[want] ? want : (bold && faces.bold ? 'bold' : 'normal')];
    };
    pdf.setFont('roboto', 'normal');
    pdf.setProperties({title: doc.header.name ? `${t('fileBase')} – ${doc.header.name}` : 'PictoEscriu', creator:'PictoEscriu'});
    const ASC = 0.9277, DESC = 0.2441, PT = 0.352778;
    const base = (top, lineH, fsMM) => top + (lineH - (ASC + DESC) * fsMM) / 2 + ASC * fsMM;
    const headImg = doc.header.show ? await headPNG() : null;
    pages.forEach((pg, pi) => {
      if(pi) pdf.addPage('a4', 'portrait');
      const pr = pg.el.getBoundingClientRect(), k = 210 / pr.width;
      const R = el => { const r = el.getBoundingClientRect(); return {x:(r.left - pr.left) * k, y:(r.top - pr.top) * k, w:r.width * k, h:r.height * k}; };
      if(pi === 0 && doc.header.show){
        const hr = R(headEl), H = HEADS[doc.header.style] || HEADS.classic; const [ar, ag, ab] = hexRgb(doc.header.bw ? '#222222' : H.lab);
        pdf.addImage(headImg, 'PNG', hr.x, hr.y, hr.w, hr.h, 'head', 'FAST');
        headEl.querySelectorAll('.hf').forEach(f => {
          const l = f.querySelector('.hl'), inp = f.querySelector('.hi'), lr = R(l), ir = R(inp);
          pdf.setFont('roboto', 'bold'); pdf.setFontSize(12); pdf.setTextColor(ar, ag, ab);
          pdf.text(l.textContent, lr.x, base(lr.y, lr.h, 12 * PT), {charSpace:0.15});
          pdf.setDrawColor(85, 85, 85); pdf.setLineWidth(0.3); pdf.line(ir.x, ir.y + ir.h - 0.15, ir.x + ir.w, ir.y + ir.h - 0.15);
          if(inp.value){ pdf.setFont('roboto', 'normal'); pdf.setFontSize(14); pdf.setTextColor(0, 0, 0); pdf.text(inp.value, ir.x + 1, base(ir.y, ir.h, 14 * PT)); }
        });
      }
      for(const el of pg.flow.children){
        const b = find(el.dataset.id); if(!b || b.kind !== 'word') continue;
        const f = eff(b), pic = el.querySelector('.pic'), lbl = el.querySelector('.lbl');
        const own = hasOwn(b);
        if(own || (showsArasaac(b) && imgData.has(b.pictoId))){
          const r = R(pic), col = CAT_COLOR[b.cat], mode = doc.settings.fitz, bw = 1.2;
          if(mode === 'frame' && col){ const [cr, cg, cb] = hexRgb(col); pdf.setDrawColor(cr, cg, cb); pdf.setFillColor(255, 255, 255); pdf.setLineWidth(bw); pdf.roundedRect(r.x + bw/2, r.y + bw/2, r.w - bw, r.h - bw, 1.2, 1.2, 'FD'); }
          if(mode === 'bg' && col){ const [cr, cg, cb] = hexRgb(col); pdf.setFillColor(cr, cg, cb); pdf.roundedRect(r.x, r.y, r.w, r.h, 1.8, 1.8, 'F'); }
          const ir = R(pic.querySelector('img')), side = Math.min(ir.w, ir.h);
          const data = own ? b.own.src : imgData.get(b.pictoId), kind = /^data:image\/jpe?g/i.test(data) ? 'JPEG' : 'PNG';
          pdf.addImage(data, kind, ir.x + (ir.w - side) / 2, ir.y + (ir.h - side) / 2, side, side, own ? 'o' + b.id : 'p' + b.pictoId, 'FAST');
          const capEl = pic.querySelector('.cap');
          if(capEl && capEl.textContent && getComputedStyle(capEl).display !== 'none'){
            const cr = R(capEl), cpt = parseFloat(capEl.style.fontSize), cfs = cpt * PT, clh = cfs * 1.15, cfm = fontMetrics({font:f.font});
            const [cf, cs] = pdfFont(f.font, false, false); pdf.setFont(cf, cs); pdf.setFontSize(cpt); pdf.setTextColor(0, 0, 0);
            pdf.text(capEl.textContent, cr.x + cr.w / 2, cr.y + (clh - (cfm.a + cfm.d) * cfs) / 2 + cfm.a * cfs, {align:'center'});
          }
        }
        if(lbl && b.text && getComputedStyle(lbl).display !== 'none' && getComputedStyle(lbl).visibility !== 'hidden'){
          const r = R(lbl), fs = f.size * PT, lh = fs * 1.2;
          const [pf, ps] = pdfFont(f.font, f.bold, f.italic && hasItalic(f.font));
          pdf.setFont(pf, ps);
          pdf.setFontSize(f.size); const [cr, cg, cb] = hexRgb(f.color); pdf.setTextColor(cr, cg, cb);
          const lines = pdf.splitTextToSize(b.text, r.w + 0.8), fm = fontMetrics(f);
          lines.forEach((ln, i) => pdf.text(ln, r.x + r.w / 2, r.y + i * lh + (lh - (fm.a + fm.d) * fs) / 2 + fm.a * fs, {align:'center'}));
        }
      }
      const fr = R(pg.foot); pdf.setFont('roboto', 'normal'); pdf.setFontSize(6.5); pdf.setTextColor(112, 112, 112);
      const flines = pg.foot.textContent.split('\n').flatMap(l => pdf.splitTextToSize(l, 180)), flh = 6.5 * PT * 1.2;
      flines.forEach((l, i) => pdf.text(l, 105, fr.y + fr.h - 0.8 - (flines.length - 1 - i) * flh, {align:'center'}));
    });
    pdf.save(fileBase() + '.pdf');
    toast(t('pdfDone'));
  }catch(e){ console.error(e); toast(t('pdfLib') + ' ' + (e && e.message || ''), {kind:'error'}); }
  finally{ hideBusy(); }
}

  const sv = $('#splashV'); if(sv) sv.textContent = t('version', {v:VERSION}).replace(/\.$/, '');
  $('#pCats').dataset.k = '';
  updateToolbar(); updatePanel(); updatePlayBtn();
  if(voiceDlg) voiceDlg.render();
}

/* ================= Wiring ================= */
document.querySelectorAll('[data-icon]').forEach(el => el.outerHTML = icon(el.dataset.icon));
$('#sSize').innerHTML = SIZES.map(s => `<option value="${s}">${s} pt</option>`).join('');
function fillFonts(){ const v = $('#sFont').value; $('#sFont').innerHTML = FONT_KEYS.map(k => `<option value="${k}" style="font-family:${esc(fontStack(k))}">${esc(t('font_' + k))}</option>`).join(''); if(v) $('#sFont').value = v; }
fillFonts();
$('#bNew').onclick = async () => {
  commitEditor(true);
  const r = await dialog({title:t('confirmNewT'), body:t('confirmNewB'), actions:[{label:t('cancel'), v:false}, {label:t('newDoc'), v:true, primary:true}]});
  if(!r.v) return;
  stopSpeech(); pushUndo(); S.selectedId = null; const keep = {...doc.settings}; doc = newDoc(); doc.settings = {...DEF_SETTINGS, fitz:keep.fitz, pictoSize:keep.pictoSize, showText:keep.showText, picPos:keep.picPos || 'below'};
  renderAll(); syncHeaderInputs(); scheduleSave(); startCompose(0);
};
$('#bOpen').onclick = () => $('#fileIn').click();
$('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; if(f) openProject(f); e.target.value = ''; });
$('#bSave').onclick = saveProject;
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bHead').onclick = openHeadGallery;
$('#sLang').addEventListener('change', e => { S.lang = e.target.value; LS.set('lang', S.lang); applyI18n(); });
$('#bCredits').onclick = () => dialog({title:t('creditsT'), body:t('version', {v:VERSION}) + '\n' + t('creditsB') + '\n' + t('voiceCredits') + '\n' + t('privacy'), actions:[{label:t('ok'), v:true, primary:true}]});
$('#bPdf').onclick = () => exportPDF(false);
$('#bPrint').onclick = doPrint;
$('#bNext').onclick = () => cycle(selectedWord(), 1);
$('#bAlts').onclick = () => { if(selectedWord()){ S.altsOpen = true; updatePanel(); $('#pAlts').scrollIntoView({block:'nearest'}); } };
$('#bText').onclick = () => mutate(() => { doc.settings.showText = !doc.settings.showText; });
let picPushed = false;
$('#rPic').addEventListener('input', e => { if(!picPushed){ pushUndo(); picPushed = true; } doc.settings.pictoSize = +e.target.value; applyDocStyles(); $('#vPic').textContent = e.target.value + ' mm'; schedulePaginate(); scheduleSave(); });
$('#rPic').addEventListener('change', () => { picPushed = false; renderAll(); });
$('#sFitz').addEventListener('change', e => { const v = e.target.value; mutate(() => { doc.settings.fitz = v; }); });
$('#sPicPos').addEventListener('change', e => { const v = e.target.value; mutate(() => { doc.settings.picPos = v; }); });
$('#sSize').addEventListener('change', e => setFmt('size', +e.target.value));
$('#sFont').addEventListener('change', e => setFmt('font', e.target.value));
$('#iColor').addEventListener('change', e => setFmt('color', e.target.value));
$('#bBold').onclick = () => setFmt('bold', !eff(selectedWord()).bold);
$('#bItalic').onclick = () => setFmt('italic', !eff(selectedWord()).italic);
$('#bUpper').onclick = () => setCase('upper');
$('#bLower').onclick = () => setCase('lower');
$('#bApplyAll').onclick = applyAll;
$('#bPlay').onclick = togglePlay;
$('#bPlayBig').onclick = togglePlay;
$('#bStudent').onclick = () => setStudent(!VS.student);
$('#bVoice').onclick = openVoiceDialog;
$('#bLock').onclick = () => setLocked(true);
$('#bUnlock').addEventListener('pointerdown', e => e.preventDefault());
$('#bUnlock').onclick = unlockTap;
$('#bFull').addEventListener('pointerdown', e => e.preventDefault());
$('#bFull').onclick = goFull;
document.addEventListener('fullscreenchange', updateFullBtn);
document.addEventListener('webkitfullscreenchange', updateFullBtn);
$('#bTools').onclick = () => { const on = document.body.classList.toggle('tools-open'); $('#bTools').setAttribute('aria-expanded', String(on)); };
// iPhone i iPad: sense zoom automàtic en tocar per escriure (el zoom amb dos dits continua funcionant)
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if(IOS){ const vp = document.querySelector('meta[name=viewport]'); if(vp) vp.content = 'width=device-width, initial-scale=1, maximum-scale=1'; }
// En pantalles tàctils, si en tocar el full el teclat no s'ha obert, es torna a intentar amb el «clic»
stack.addEventListener('click', e => { if(S.editor && document.activeElement !== edInput && e.target.closest('.page') && !e.target.closest('.sheet-head')) focusEditor(); });
// Llegir i el mode alumne no treuen el cursor de l'editor: l'alumne pot continuar escrivint
['#bPlay', '#bPlayBig', '#bStudent'].forEach(s => $(s).addEventListener('pointerdown', e => e.preventDefault()));
sndIndex(); memLoad();
pvCheck().then(() => { const lang = S.lang === 'es' ? 'es' : 'ca', v = pickVoice(lang);
  if(v && v.piper) setTimeout(() => pvSession(lang).catch(() => {}), 2500); });
if(hasSynth()){ loadVoices(); const sy = synth();
  if(sy.addEventListener) sy.addEventListener('voiceschanged', loadVoices); else sy.onvoiceschanged = loadVoices;
  [400, 1500, 4000].forEach(ms => setTimeout(() => { if(!SP.voices.length) loadVoices(); }, ms)); }
$('#bZoomIn').onclick = () => setZoom(zoomVal() + 0.1);
$('#bZoomOut').onclick = () => setZoom(zoomVal() - 0.1);
$('#bFitPage').onclick = () => fit('page');
$('#bFitWidth').onclick = () => fit('width');
// Els botons de la barra no han de robar el focus de l'editor en prémer-los
document.querySelectorAll('.topbar .btn').forEach(b => b.addEventListener('pointerdown', e => { if(S.editor && S.editor.mode === 'compose') return; e.preventDefault(); }));
new ResizeObserver(() => document.documentElement.style.setProperty('--bar-h', $('#topbar').offsetHeight + 'px')).observe($('#topbar'));
window.addEventListener('beforeprint', () => { commitEditor(true); });

/* ================= Boot ================= */
// Pantalla d'inici: uns 2 segons, o fins que es toca o es prem una tecla
function hideSplash(){ const sp = $('#splash'); if(!sp || sp.classList.contains('out')) return; sp.classList.add('out'); setTimeout(() => sp.remove(), 500);
  document.removeEventListener('keydown', hideSplash, true); }
$('#splash').addEventListener('pointerdown', e => { e.preventDefault(); hideSplash(); });
document.addEventListener('keydown', hideSplash, true);
setTimeout(hideSplash, 2200);
fontsReady.then(function boot(){
  // En obrir, sempre un document en blanc (decisió de la mestra, 3/11/2026). L'últim document es guarda a part
  // i es pot recuperar amb el botó de l'avís. Es mantenen els ajustos dels pictogrames, com amb «Nou».
  const hasContent = d => !!d && d.app === 'PictoEscriu' && ((d.blocks && d.blocks.length > 0) || !!(d.header && (d.header.name || d.header.date)));
  const draft = LS.get('draft', null);
  if(hasContent(draft)) LS.set('prevDraft', draft);
  const prev = LS.get('prevDraft', null), ks = (draft && draft.settings) || {};
  makePage(0);
  applyI18n(); applyVoiceUI();
  if(LS.get('locked', false)){ document.body.classList.add('locked'); $('#lockBar').hidden = false; }
  doc.settings = {...DEF_SETTINGS, ...['fitz', 'pictoSize', 'showText', 'picPos'].reduce((o, k) => (ks[k] != null && (o[k] = ks[k]), o), {})};
  renderAll();
  if(hasContent(prev)) toast(t('blankStart'), {action:{label:t('recoverLast'), fn:() => { commitEditor(true); pushUndo(); S.selectedId = null; restore(prev); startCompose(doc.blocks.length); toast(t('recovered')); }}, timeout:15000});
  syncHeaderInputs();
  const z = LS.get('zoom', null);
  requestAnimationFrame(() => { if(z) setZoom(z); else fit('page'); startCompose(doc.blocks.length); if(isLocked()) setLocked(true, true); });
});
</script>
</body>
</html>
